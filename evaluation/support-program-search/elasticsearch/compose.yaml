# Local lexical-search experiment only. Does not load the application .env.
name: govbiz-es-lexical-experiment

services:
  elasticsearch:
    build: .
    environment:
      cluster.name: govbiz-es-lexical-experiment
      node.name: lexical-experiment
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      xpack.license.self_generated.type: basic
      ingest.geoip.downloader.enabled: "false"
      action.auto_create_index: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:19200:9200"
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Disposable public fixture copies only; no persistent application volumes.
    tmpfs:
      - /usr/share/elasticsearch/data:uid=1000,gid=0
    networks:
      - experiment
    healthcheck:
      test: [CMD, curl, --fail, --silent, "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s"]
      interval: 5s
      timeout: 3s
      retries: 40

networks:
  experiment:
    # A dedicated bridge keeps this separate from the application network.
    # Docker Desktop does not publish host ports on an internal-only bridge.
    driver: bridge
