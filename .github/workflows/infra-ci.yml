name: Infra CI

on:
  push:
  pull_request:

permissions:
  contents: read

# GitOps code lives inside the application repository; Actions are discovered
# only in the repository-root .github/workflows directory.
defaults:
  run:
    working-directory: infrastructure/gitops

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fork-identity:
    name: Fork identity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-2025]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Test account-independent Git identity without Docker or credentials
        run: python -B -m unittest discover -s infrastructure/release -p test_repository.py

  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check whitespace
        run: git show --format= --check HEAD
      - name: Validate repository boundary and documentation links
        run: python -B scripts/check_repository.py

  kubernetes-manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: infrastructure/gitops/scripts/requirements.txt
      - name: Install manifest parser
        run: python -m pip install --requirement scripts/requirements.txt
      - name: Set up Node.js for offline Langfuse authentication probe tests
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.22.0
          runtime: node@24
          install: false
          cache: false
          package-json-file: package.json
      - name: Install kubectl for offline Kustomize rendering
        env:
          KUBECTL_VERSION: v1.36.4
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" --output "$tool_dir/kubectl"
          curl --fail --silent --show-error --location "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" --output "$tool_dir/kubectl.sha256"
          (cd "$tool_dir" && echo "$(< kubectl.sha256)  kubectl" | sha256sum --check)
          chmod +x "$tool_dir/kubectl"
          echo "$tool_dir" >> "$GITHUB_PATH"
      # This job also discovers test_deployment.py, which renders with the pinned Helm CLI.
      - name: Install pinned Helm with checksum verification
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          cd "$tool_dir"
          curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz.sha256sum
          sha256sum --check helm-v4.3.0-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v4.3.0-linux-amd64.tar.gz
          echo "$tool_dir/linux-amd64" >> "$GITHUB_PATH"
      - name: Verify pinned Helm version
        run: |
          actual_helm_version="$(helm version --template '{{.Version}}')"
          test "$actual_helm_version" = "v4.3.0"
      - name: Test repository, manifest policies and smoke-test safety guards
        run: python -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Render local overlays and validate policies without a cluster
        run: python -B scripts/check_kubernetes.py

  helm-gitops:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --requirement scripts/requirements.txt
      - name: Install pinned Helm with checksum verification
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          cd "$tool_dir"
          curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz.sha256sum
          sha256sum --check helm-v4.3.0-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v4.3.0-linux-amd64.tar.gz
          echo "$tool_dir/linux-amd64" >> "$GITHUB_PATH"
      - name: Verify pinned Helm version
        run: |
          actual_helm_version="$(helm version --template '{{.Version}}')"
          test "$actual_helm_version" = "v4.3.0"
      # All scripts/test_*.py run once in kubernetes-manifests. Keep this job
      # for chart validation/lint; merge-readiness still requires both jobs.
      - name: Validate independent releases and Argo project scope
        run: |
          python -B scripts/check_msa.py
          python -B scripts/check_portfolio.py
      - name: Lint services, disposable local storage and observability
        run: |
          set -euo pipefail
          for service in core-service catalog-service ai-service ops-service web; do
            helm lint charts/govbiz-service -f "environments/local-msa/$service.yaml" --strict
          done
          helm lint charts/govbiz-local-data --set allowDisposableData=true --strict
          helm lint charts/govbiz-local-data --set allowDisposableData=true --set rabbitmq.enabled=true --strict
          helm lint charts/govbiz-observability --namespace govbiz-observability --set node=fixture-control-plane --strict

  merge-readiness:
    name: Required CI / Infra
    if: ${{ always() }}
    needs: [fork-identity, repository, kubernetes-manifests, helm-gitops]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out CI policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every dependency to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -B infrastructure/release/ci_policy.py infra-ci.yml
