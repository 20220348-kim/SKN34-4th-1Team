name: EKS and Vercel release

on:
  workflow_run:
    workflows: [GovBiz CI, Catalog separation CI, GovBiz Ops CI, Infra CI, LLMOps CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Serialize complete releases, including Vercel promotion. Never interrupt a migration.
concurrency:
  group: govbiz-eks-production
  cancel-in-progress: false

env:
  GOVBIZ_RELEASE_BRANCH: main
  EKS_RELEASE_ENABLED: ${{ vars.EKS_RELEASE_ENABLED }}

jobs:
  gate:
    if: ${{ github.repository == 'ilil1/SKN34-4th-1Team' && vars.EKS_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B infrastructure/eks/release.py gate

  backend:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    # CodeBuild supplies a short-lived AWS service role. No GitHub AWS OIDC/key.
    runs-on: codebuild-${{ vars.EKS_DEPLOY_PROJECT }}-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 120
    environment: eks-production
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.gate.outputs.sha }}
      AWS_REGION: ap-southeast-2
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Set up Python for safe tracked-source archives
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install checksum-verified kubectl and verify runner tools
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/eks-tools"
          mkdir -p "$tool_dir"
          curl -fsSL https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl -o "$tool_dir/kubectl"
          curl -fsSL https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl.sha256 -o "$tool_dir/kubectl.sha256"
          (cd "$tool_dir" && echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check)
          chmod +x "$tool_dir/kubectl"
          echo "$tool_dir" >> "$GITHUB_PATH"
          aws --version
          gh --version
          docker info >/dev/null
      - name: Recheck the exact main commit before publication
        run: python3 -B infrastructure/eks/release.py check --sha "$SOURCE_SHA"
      - name: Publish five immutable ECR images from the tested Git source
        run: python3 -B infrastructure/eks/release.py publish --sha "$SOURCE_SHA" --output "$RUNNER_TEMP/release.json"
      - name: Deploy inside the EKS VPC and wait for rollout
        env:
          KUBECONFIG: ${{ runner.temp }}/govbiz-eks-kubeconfig
        run: python3 -B infrastructure/eks/release.py rollout --sha "$SOURCE_SHA" --output "$RUNNER_TEMP/release.json"
      - name: Save source and image evidence, without secrets or data
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eks-release
          path: ${{ runner.temp }}/release.json
          if-no-files-found: warn
          retention-days: 30

  web:
    needs: [gate, backend]
    if: needs.gate.outputs.ready == 'true' && needs.backend.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: eks-production
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.gate.outputs.sha }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.22.0
          runtime: node@24
          install: false
          cache: false
          package-json-file: package.json
      - name: Prepare only tracked web and shared inputs
        run: |
          test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" && test -n "$VERCEL_TOKEN"
          python3 -B infrastructure/eks/release.py web-source --sha "$SOURCE_SHA" --output "$RUNNER_TEMP/vercel-source"
      - name: Build the production web without switching its domains
        run: |
          cd "$RUNNER_TEMP/vercel-source"
          npm exec --yes --package=vercel@63.1.2 -- vercel deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" \
            --meta "githubCommitSha=$SOURCE_SHA" --meta githubCommitRef=main > "$RUNNER_TEMP/vercel-url.txt"
      - name: Recheck CI and promote this deployment to the existing Vercel project
        run: |
          python3 -B infrastructure/eks/release.py web-promote --sha "$SOURCE_SHA" \
            --deployment-url-file "$RUNNER_TEMP/vercel-url.txt" --output "$RUNNER_TEMP/vercel-release.json"
      - name: Save verified production web deployment evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-release
          path: ${{ runner.temp }}/vercel-release.json
          if-no-files-found: error
          retention-days: 30
