name: EKS and Vercel release

on:
  workflow_run:
    workflows: [GovBiz CI, Catalog separation CI, GovBiz Ops CI, Infra CI, LLMOps CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Serialize complete releases, including Vercel promotion. Never interrupt a migration.
concurrency:
  group: govbiz-eks-production
  cancel-in-progress: false

env:
  GOVBIZ_RELEASE_BRANCH: main
  EKS_RELEASE_ENABLED: ${{ vars.EKS_RELEASE_ENABLED }}

jobs:
  gate:
    if: ${{ github.repository == 'ilil1/SKN34-4th-1Team' && vars.EKS_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B infrastructure/eks/release.py gate

  backend:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: eks-production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.gate.outputs.sha }}
      AWS_REGION: ap-southeast-2
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      EKS_RELEASE_BUCKET: ${{ vars.EKS_RELEASE_BUCKET }}
      EKS_DEPLOY_PROJECT: ${{ vars.EKS_DEPLOY_PROJECT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Recheck the exact main commit before acquiring AWS credentials
        run: python3 -B infrastructure/eks/release.py check --sha "$SOURCE_SHA"
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.EKS_RELEASE_ROLE_ARN }}
          aws-region: ap-southeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 7200
      - name: Publish five immutable ECR images from the tested Git source
        run: python3 -B infrastructure/eks/release.py publish --sha "$SOURCE_SHA" --output "$RUNNER_TEMP/release.json"
      - name: Deploy through CodeBuild inside the EKS VPC and wait for rollout
        run: python3 -B infrastructure/eks/release.py dispatch --sha "$SOURCE_SHA" --output "$RUNNER_TEMP/release.json"
      - name: Save source and image evidence, without secrets or data
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eks-release
          path: ${{ runner.temp }}/release.json
          if-no-files-found: warn
          retention-days: 30

  web:
    needs: [gate, backend]
    if: needs.gate.outputs.ready == 'true' && needs.backend.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: eks-production
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.gate.outputs.sha }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.22.0
          runtime: node@24
          install: false
          cache: false
          package-json-file: package.json
      - name: Prepare only tracked web and shared inputs
        run: |
          test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" && test -n "$VERCEL_TOKEN"
          python3 -B infrastructure/eks/release.py web-source --sha "$SOURCE_SHA" --output "$RUNNER_TEMP/vercel-source"
      - name: Build the production web without switching its domains
        run: |
          cd "$RUNNER_TEMP/vercel-source"
          npm exec --yes --package=vercel@63.1.2 -- vercel deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" \
            --meta "githubCommitSha=$SOURCE_SHA" --meta githubCommitRef=main > "$RUNNER_TEMP/vercel-url.txt"
      - name: Recheck CI and promote this deployment to the existing Vercel project
        run: |
          python3 -B infrastructure/eks/release.py check --sha "$SOURCE_SHA"
          cd "$RUNNER_TEMP/vercel-source"
          npm exec --yes --package=vercel@63.1.2 -- vercel promote "$(cat "$RUNNER_TEMP/vercel-url.txt")" --yes --token "$VERCEL_TOKEN"
