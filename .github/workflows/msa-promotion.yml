name: Fork image promotion

on:
  workflow_run:
    workflows: [MSA image candidates]
    types: [completed]
  workflow_dispatch:

env:
  GOVBIZ_RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
  MSA_PROMOTION_ENABLED: ${{ vars.MSA_PROMOTION_ENABLED }}

permissions:
  contents: read
  actions: read

defaults:
  run:
    working-directory: infrastructure/gitops

concurrency:
  group: fork-image-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.repository_owner != 'SKNETWORKS-FAMILY-AICAMP' && github.event.repository.owner.type == 'User' && github.event.repository.fork && vars.MSA_PROMOTION_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      source_sha: ${{ steps.select.outputs.source_sha }}
      reason: ${{ steps.select.outputs.reason }}
      publisher_run_id: ${{ steps.select.outputs.publisher_run_id }}
      selection_result: ${{ steps.select.outcome }}
      validation_result: ${{ steps.validate.outcome }}
      commit_result: ${{ steps.commit.outcome }}
      push_attempted: ${{ steps.commit.outputs.push_attempted }}
      pushed: ${{ steps.commit.outputs.pushed }}
      unchanged: ${{ steps.commit.outputs.unchanged }}
      revision: ${{ steps.commit.outputs.revision }}
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement scripts/requirements.txt
      - name: Install pinned Helm and kubectl
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          cd "$tool_dir"
          curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz.sha256sum
          sha256sum --check helm-v4.3.0-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v4.3.0-linux-amd64.tar.gz
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl
          curl -fsSLo kubectl.sha256 https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl.sha256
          echo "$(< kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          echo "$tool_dir" >> "$GITHUB_PATH"
          echo "$tool_dir/linux-amd64" >> "$GITHUB_PATH"
      - name: Test policy and promotion tools
        run: python -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Fetch verified receipts and select digests
        id: select
        run: python -B scripts/sync_images.py --write
      - name: Validate proposed deployment before any push
        id: validate
        if: steps.select.outputs.prepared == 'true'
        run: |
          set -euo pipefail
          python -B scripts/check_repository.py
          python -B scripts/check_kubernetes.py
          python -B scripts/check_msa.py
          python -B scripts/check_portfolio.py
          if test -f environments/fork/release.json; then
            python -B -c 'import sys; sys.path.insert(0,"scripts"); from check_portfolio import fork_errors; from sync_images import from_ci; problems=fork_errors(from_ci()); sys.exit("\n".join(problems)) if problems else None'
          fi
          for service in core-service catalog-service ai-service ops-service; do
            if test -f "environments/fork/$service.yaml"; then
              helm lint charts/govbiz-service -f "environments/fork/$service.yaml" --strict
              helm template "$service" charts/govbiz-service -f "environments/fork/$service.yaml" > /dev/null
            fi
          done
          git diff --check
      - name: Commit only this fork's image selection without force-push
        id: commit
        if: steps.select.outputs.prepared == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add environments/fork/core-service.yaml environments/fork/catalog-service.yaml environments/fork/ai-service.yaml environments/fork/ops-service.yaml environments/fork/release.json
          python -B -c 'import subprocess,sys; sys.path.insert(0,"../release"); from gate import PROMOTION_PATHS; changed=set(subprocess.check_output(["git", "diff", "--cached", "--name-only"],text=True).splitlines()); sys.exit("Unexpected staged files") if changed - PROMOTION_PATHS else None'
          python -B scripts/sync_images.py --verify-record
          if git diff --cached --quiet; then
            echo 'unchanged=true' >> "$GITHUB_OUTPUT"
            echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '배포: 검증된 서비스 이미지 digest 자동 갱신'
          gh auth setup-git
          # A GITHUB_TOKEN push does not trigger new push workflows. This avoids
          # an image→digest→image loop; Argo still observes the Git commit.
          revision="$(git rev-parse HEAD)"
          echo 'push_attempted=true' >> "$GITHUB_OUTPUT"
          git push origin "HEAD:refs/heads/$GOVBIZ_RELEASE_BRANCH"
          test "$(git ls-remote --heads origin "refs/heads/$GOVBIZ_RELEASE_BRANCH" | cut -f1)" = "$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo 'pushed=true' >> "$GITHUB_OUTPUT"

  outcome:
    needs: [promote]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Record promotion separately from cluster deployment
        working-directory: .
        env:
          RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B infrastructure/release/outcome.py --stage promotion --output "${RUNNER_TEMP}/promotion-result.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msa-promotion-result
          path: ${{ runner.temp }}/promotion-result.json
          if-no-files-found: error
          retention-days: 30
