name: Local Argo release

on:
  workflow_run:
    workflows: [GovBiz CI, Catalog separation CI, GovBiz Ops CI, Infra CI, LLMOps CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GOVBIZ_RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
  MSA_RELEASE_ENABLED: ${{ vars.MSA_RELEASE_ENABLED }}
  MSA_PACKAGE_VISIBILITY: public
  LOCAL_ARGO_RELEASE_ENABLED: ${{ vars.LOCAL_ARGO_RELEASE_ENABLED }}

concurrency:
  group: local-argo-release
  cancel-in-progress: false

jobs:
  gate:
    if: ${{ github.repository_owner != 'SKNETWORKS-FAMILY-AICAMP' && github.event.repository.owner.type == 'User' && github.event.repository.fork && vars.MSA_RELEASE_ENABLED == 'true' && vars.LOCAL_ARGO_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B infrastructure/release/gate.py

  images:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: msa-release
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        service: [core-service, catalog-service, ai-service, ops-service, web, evaluation-runner]
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.gate.outputs.sha }}
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Publish only tested tracked inputs or reuse their verified image
        run: python3 -B infrastructure/release/publish.py --service "$SERVICE" --sha "$SOURCE_SHA" --output "${RUNNER_TEMP}/${SERVICE}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-receipt-${{ github.run_attempt }}-${{ matrix.service }}
          path: ${{ runner.temp }}/${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [gate, images]
    if: needs.gate.outputs.ready == 'true' && needs.images.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: msa-release
    permissions:
      contents: write # Only immutable govbiz-local/* tags; no branch or PR writes.
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement infrastructure/gitops/scripts/requirements.txt
      - name: Install pinned Helm with checksum verification
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          cd "$tool_dir"
          curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz.sha256sum
          sha256sum --check helm-v4.3.0-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v4.3.0-linux-amd64.tar.gz
          echo "$tool_dir/linux-amd64" >> "$GITHUB_PATH"
      - name: Verify every receipt, render the release and recheck CI before publishing its tag
        run: |
          gh auth setup-git
          python -B infrastructure/gitops/scripts/local_release.py publish --sha "$SOURCE_SHA"
