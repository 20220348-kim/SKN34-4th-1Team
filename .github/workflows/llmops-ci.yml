name: LLMOps CI

on:
  push:
    paths:
      - 'backend/ai-service/**'
      - 'backend/ops-service/**'
      - 'evaluation/support-program-evidence/**'
      - 'infrastructure/llmops/**'
      - '.github/workflows/llmops-ci.yml'
  pull_request:
    paths:
      - 'backend/ai-service/**'
      - 'backend/ops-service/**'
      - 'evaluation/support-program-evidence/**'
      - 'infrastructure/llmops/**'
      - '.github/workflows/llmops-ci.yml'

permissions:
  contents: read

jobs:
  integration:
    name: Saved capture pipeline with local servers
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.5'
          python-version: '3.12'
          working-directory: backend/ai-service
      - name: Install locked evaluation dependencies
        working-directory: backend/ai-service
        run: uv sync --locked --extra dev --group evaluation
      - name: Generate isolated development credentials
        run: |
          backend/ai-service/.venv/bin/python infrastructure/llmops/init_env.py
          backend/ai-service/.venv/bin/python infrastructure/llmops/init_ops_env.py
      - name: Start local Langfuse and Prefect
        run: |
          docker compose --env-file infrastructure/llmops/.env -f infrastructure/llmops/compose.yaml --profile evaluation config --quiet
          docker compose --env-file infrastructure/llmops/.env -f infrastructure/llmops/compose.yaml --profile evaluation up -d --quiet-pull
      - name: Verify tracing, score persistence, replay and flow failures without model calls
        shell: bash
        run: |
          set -a
          source infrastructure/llmops/.env
          set +a
          backend/ai-service/.venv/bin/python infrastructure/llmops/smoke.py --output-dir work/llmops-ci
      - name: Build and start Django Ops and evaluation runner
        run: |
          docker compose --env-file infrastructure/llmops/.env --env-file infrastructure/llmops/.env.ops -f infrastructure/llmops/compose.yaml -f infrastructure/llmops/compose.ops.yaml --profile evaluation config --quiet
          docker compose --env-file infrastructure/llmops/.env --env-file infrastructure/llmops/.env.ops -f infrastructure/llmops/compose.yaml -f infrastructure/llmops/compose.ops.yaml --profile evaluation up -d --build ops-service evaluation-runner
      - name: Apply isolated Ops migrations and create smoke operator
        shell: bash
        run: |
          set -a
          source infrastructure/llmops/.env.ops
          set +a
          export DJANGO_SUPERUSER_PASSWORD="$OPS_ADMIN_PASSWORD"
          docker compose --env-file infrastructure/llmops/.env --env-file infrastructure/llmops/.env.ops -f infrastructure/llmops/compose.yaml -f infrastructure/llmops/compose.ops.yaml --profile evaluation exec -T ops-service python manage.py migrate --noinput
          docker compose --env-file infrastructure/llmops/.env --env-file infrastructure/llmops/.env.ops -f infrastructure/llmops/compose.yaml -f infrastructure/llmops/compose.ops.yaml --profile evaluation exec -T -e DJANGO_SUPERUSER_PASSWORD ops-service python manage.py createsuperuser --noinput --username "$OPS_ADMIN_USERNAME" --email ops@localhost.test
      - name: Verify Django login, CSRF, duplicate requests and report HTTP response
        shell: bash
        run: |
          set -a
          source infrastructure/llmops/.env.ops
          set +a
          python infrastructure/llmops/ops_smoke.py --output work/llmops-ci/ops-verification.json
      - name: Stop this job's development containers
        if: always()
        run: docker compose --env-file infrastructure/llmops/.env --env-file infrastructure/llmops/.env.ops -f infrastructure/llmops/compose.yaml -f infrastructure/llmops/compose.ops.yaml --profile evaluation down
