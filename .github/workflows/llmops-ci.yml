name: LLMOps CI

on:
  # Every push needs a result for the same SHA, including docs-only/empty commits.
  # Publication separately restricts the default branch, upstream merge and fork opt-in.
  push:
  pull_request:
    paths:
      - 'backend/ai-service/**'
      - 'backend/ops-service/**'
      - 'backend/core-service/**'
      - 'frontend/web/src/**/ops/**'
      - 'frontend/web/src/App*'
      - 'frontend/web/src/data/api/accountApi.ts'
      - 'frontend/web/src/data/repositories/AccountRepositoryImpl.ts'
      - 'frontend/web/src/presentation/**/auth/**'
      - 'frontend/web/vite.config*'
      - 'frontend/web/package.json'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'evaluation/support-program-evidence/**'
      - 'infrastructure/llmops/**'
      - '.github/workflows/llmops-ci.yml'
      - '.github/workflows/msa-images.yml'
      - '.github/workflows/msa-promotion.yml'
      - 'infrastructure/release/**'
      - 'infrastructure/gitops/scripts/sync_images.py'
      - 'infrastructure/gitops/scripts/test_sync_images.py'

permissions:
  contents: read

jobs:
  integration:
    name: Saved capture pipeline with local servers
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.5'
          python-version: '3.12'
          working-directory: backend/ai-service
      - name: Install locked evaluation dependencies
        working-directory: backend/ai-service
        run: uv sync --locked --extra dev --group evaluation
      - name: Verify execution release
        run: backend/ai-service/.venv/bin/python backend/ops-service/apps/evaluations/execution_spec.py
      - name: Test synchronization and cancellation smoke assertions without servers
        working-directory: backend/ai-service
        run: uv run --locked --extra dev --group evaluation python -m pytest ../../infrastructure/llmops/test_ops_smoke.py ../../infrastructure/llmops/test_cancellation_smoke.py ../../infrastructure/llmops/test_search_trace_smoke.py -q
      - name: Generate isolated development credentials
        run: |
          backend/ai-service/.venv/bin/python infrastructure/llmops/init_env.py
          backend/ai-service/.venv/bin/python infrastructure/llmops/init_ops_env.py
      - name: Start local Langfuse and Prefect
        run: |
          docker compose --env-file infrastructure/llmops/.env -f infrastructure/llmops/compose.yaml --profile evaluation config --quiet
          docker compose --env-file infrastructure/llmops/.env -f infrastructure/llmops/compose.yaml --profile evaluation up -d --quiet-pull
      - name: Verify tracing, score persistence, replay and flow failures without model calls
        shell: bash
        run: |
          set -a
          source infrastructure/llmops/.env
          set +a
          backend/ai-service/.venv/bin/python infrastructure/llmops/smoke.py --output-dir work/llmops-ci
      - name: Build and start Core auth fixture, Django Ops and evaluation runner
        run: |
          docker compose --env-file infrastructure/llmops/.env --env-file infrastructure/llmops/.env.ops -f infrastructure/llmops/compose.yaml -f infrastructure/llmops/compose.ops.yaml -f infrastructure/llmops/compose.auth-test.yaml --profile evaluation config --quiet
          docker compose --env-file infrastructure/llmops/.env --env-file infrastructure/llmops/.env.ops -f infrastructure/llmops/compose.yaml -f infrastructure/llmops/compose.ops.yaml -f infrastructure/llmops/compose.auth-test.yaml --profile evaluation up -d --build auth-core ops-service evaluation-runner
      - name: Apply isolated Ops migrations
        run: docker compose --env-file infrastructure/llmops/.env --env-file infrastructure/llmops/.env.ops -f infrastructure/llmops/compose.yaml -f infrastructure/llmops/compose.ops.yaml -f infrastructure/llmops/compose.auth-test.yaml --profile evaluation exec -T ops-service python manage.py migrate --noinput
      - name: Reject mismatched Ops and runner releases before model calls
        run: python3 infrastructure/llmops/spec_mismatch_smoke.py --output work/llmops-spec-mismatch.json
      - name: Start background Ops status synchronization after migrations
        run: docker compose --env-file infrastructure/llmops/.env --env-file infrastructure/llmops/.env.ops -f infrastructure/llmops/compose.yaml -f infrastructure/llmops/compose.ops.yaml -f infrastructure/llmops/compose.auth-test.yaml --profile evaluation up -d --build ops-sync
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.22.0
          runtime: node@24
          install: false
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          package-json-file: package.json
      - name: Start React development proxy
        run: |
          pnpm install --frozen-lockfile
          VITE_DEV_PROXY_TARGET=http://127.0.0.1:18082 VITE_CORE_API_BASE_URL=/ pnpm --filter govbiz-web dev --host 127.0.0.1 > /tmp/govbiz-ops-web.log 2>&1 &
      - name: Verify Core admin login, Ops CSRF, duplicate requests, reports and shared logout
        shell: bash
        run: |
          set -a
          source infrastructure/llmops/.env.ops
          set +a
          export CORE_ADMIN_EMAIL=admin@govbiz.local
          export CORE_ADMIN_PASSWORD="$OPS_ADMIN_PASSWORD"
          python infrastructure/llmops/ops_smoke.py --seed-dev-accounts --base-url http://localhost:5173 --output work/llmops-ci/ops-verification.json
          python infrastructure/llmops/ops_smoke.py --compare-captures --base-url http://localhost:5173 --output work/llmops-ci/ops-comparison-verification.json
      - name: Verify failed publication recovery through Ops and Prefect without model calls
        shell: bash
        run: |
          set -a
          source infrastructure/llmops/.env.ops
          set +a
          export CORE_ADMIN_EMAIL=admin@govbiz.local
          export CORE_ADMIN_PASSWORD="$OPS_ADMIN_PASSWORD"
          dc() {
            docker compose --env-file infrastructure/llmops/.env --env-file infrastructure/llmops/.env.ops -f infrastructure/llmops/compose.yaml -f infrastructure/llmops/compose.ops.yaml -f infrastructure/llmops/compose.auth-test.yaml --profile evaluation "$@"
          }
          source_id=$(python -c 'from uuid import uuid4; print(uuid4())')
          fixture="$PWD/infrastructure/llmops/recovery_smoke_fixture.py:/tmp/recovery_smoke_fixture.py:ro"
          dc run --rm --no-deps -v "$fixture" -e OPENAI_API_KEY= -e LLMOPS_LIVE_ENABLED=false evaluation-runner .venv/bin/python /tmp/recovery_smoke_fixture.py prepare --source-id "$source_id"
          dc run --rm --no-deps -v "$fixture" ops-service python /tmp/recovery_smoke_fixture.py register --source-id "$source_id" --operator-email "$CORE_ADMIN_EMAIL"
          python infrastructure/llmops/ops_smoke.py --recover-source "$source_id" --base-url http://localhost:5173 --output work/llmops-ci/ops-recovery-verification.json
          recovery_id=$(python -c 'import json; print(json.load(open("work/llmops-ci/ops-recovery-verification.json"))["request_id"])')
          dc run --rm --no-deps -v "$fixture" -e OPENAI_API_KEY= -e LLMOPS_LIVE_ENABLED=false evaluation-runner .venv/bin/python /tmp/recovery_smoke_fixture.py verify --source-id "$source_id" --recovery-id "$recovery_id"
      - name: Stop this job's development containers
        if: always()
        run: docker compose --env-file infrastructure/llmops/.env --env-file infrastructure/llmops/.env.ops -f infrastructure/llmops/compose.yaml -f infrastructure/llmops/compose.ops.yaml -f infrastructure/llmops/compose.auth-test.yaml --profile evaluation down
      - name: Verify real cancellation, process exit and budget accounting with offline model HTTP
        # Includes cold server startup and all 11 scenarios; per-scenario deadlines stay strict.
        timeout-minutes: 20
        run: backend/ai-service/.venv/bin/python infrastructure/llmops/cancellation_smoke.py --output work/llmops-ci/cancellation.json
      - name: Preserve cancellation evidence including failed scenarios
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llmops-cancellation-${{ github.sha }}
          path: work/llmops-ci/cancellation.json
          if-no-files-found: warn
          retention-days: 7
