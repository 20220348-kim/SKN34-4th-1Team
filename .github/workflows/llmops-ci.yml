name: LLMOps CI

on:
  # Every push needs a result for the same SHA, including docs-only/empty commits.
  # Publication separately restricts the default branch, upstream merge and fork opt-in.
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    name: Saved capture pipeline with local servers
    runs-on: ubuntu-24.04
    # Retain Core tracing and the expanded Kubernetes evaluation/restart checks.
    timeout-minutes: 90
    services:
      ragmysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: govbiz_rag_budget_ci
          MYSQL_ROOT_PASSWORD: ci-only-rag-budget-password
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.5'
          python-version: '3.12'
          working-directory: backend/ai-service
      - name: Install locked evaluation dependencies
        working-directory: backend/ai-service
        run: uv sync --locked --extra dev --group evaluation
      - name: Verify execution release
        run: backend/ai-service/.venv/bin/python backend/ops-service/apps/evaluations/execution_spec.py
      - name: Test offline runner preparation checks
        working-directory: backend/ai-service
        run: uv run --locked --extra dev --group evaluation python -m pytest ../../infrastructure/llmops/test_check_runner_runtime.py -q
      - name: Test smoke assertions and offline HTTP model fixtures
        working-directory: backend/ai-service
        run: uv run --locked --extra dev --group evaluation python -m pytest ../../infrastructure/llmops/test_ops_smoke.py ../../infrastructure/llmops/test_cancellation_smoke.py ../../infrastructure/llmops/test_search_trace_smoke.py ../../infrastructure/llmops/test_core_search_trace.py ../../infrastructure/llmops/test_core_assistant_trace.py ../../infrastructure/llmops/test_core_evidence_trace.py ../../infrastructure/llmops/test_core_rag_capture.py ../../infrastructure/llmops/test_core_rag_budget.py ../../infrastructure/llmops/test_register_core_rag.py ../../infrastructure/scripts/test_catalog_separation_config.py -q
      - name: Generate isolated development credentials
        run: |
          backend/ai-service/.venv/bin/python infrastructure/llmops/init_env.py
          backend/ai-service/.venv/bin/python infrastructure/llmops/init_ops_env.py
          backend/ai-service/.venv/bin/python infrastructure/llmops/init_ops_env.py --artifacts
      - name: Start local Langfuse and Prefect
        run: |
          docker compose --env-file infrastructure/llmops/.env -f infrastructure/llmops/compose.yaml --profile evaluation config --quiet
          docker compose --env-file infrastructure/llmops/.env -f infrastructure/llmops/compose.yaml --profile evaluation up -d --quiet-pull
      - name: Verify running ClickHouse memory limits before pipeline checks
        shell: bash
        run: |
          set -euo pipefail
          dc() { docker compose --env-file infrastructure/llmops/.env -f infrastructure/llmops/compose.yaml "$@"; }
          container=$(dc ps -q clickhouse)
          test -n "$container"
          test "$(docker inspect --format '{{.HostConfig.Memory}}' "$container")" = 3221225472
          dc exec -T clickhouse sh -eu -c 'clickhouse-client --user "$CLICKHOUSE_USER" --password "$CLICKHOUSE_PASSWORD" --query "
            SELECT throwIf(count() != 3, '\''ClickHouse memory settings were not applied'\'')
            FROM system.server_settings
            WHERE (name = '\''max_server_memory_usage'\'' AND value = '\''2147483648'\'')
               OR (name = '\''mark_cache_size'\'' AND value = '\''134217728'\'')
               OR (name = '\''memory_worker_correct_memory_tracker'\'' AND value = '\''1'\'')
          "'
      - name: Verify tracing, score persistence, replay and flow failures without model calls
        shell: bash
        run: |
          set -a
          source infrastructure/llmops/.env
          set +a
          backend/ai-service/.venv/bin/python infrastructure/llmops/smoke.py --output-dir work/llmops-ci
      - name: Verify actual Core search, assistant and detailed RAG traces, failures and timeouts
        timeout-minutes: 30
        shell: bash
        run: |
          set -a
          source infrastructure/llmops/.env
          set +a
          backend/ai-service/.venv/bin/python -B infrastructure/scripts/verify-catalog-separation.py --search-traces-output work/llmops-ci/core-search-traces.json --assistant-traces-output work/llmops-ci/core-assistant-traces.json --evidence-traces-output work/llmops-ci/core-evidence-traces.json --rag-capture-output work/llmops-ci/core-rag
      - name: Install locked Ops environment for Core budget integration
        working-directory: backend/ops-service
        run: |
          sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config
          uv sync --locked
      - name: Reserve actual Core plans and settle through Ops HTTP and MySQL
        working-directory: backend/ops-service
        env:
          DJANGO_SECRET_KEY: ci-only-core-rag-budget-test-secret-not-for-deployment-2026
          DJANGO_DEBUG: "false"
          DB_NAME: govbiz_rag_budget_ci
          DB_USER: root
          DB_PASSWORD: ci-only-rag-budget-password
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.ragmysql.ports[3306] }}
          PYTHONPATH: ${{ github.workspace }}/infrastructure/llmops
          RAG_BUDGET_AI_PYTHON: ${{ github.workspace }}/backend/ai-service/.venv/bin/python
          CORE_RAG_CAPTURE_ROOT: ${{ github.workspace }}/work/llmops-ci/core-rag
          CORE_RAG_BUDGET_REPORT: ${{ github.workspace }}/work/llmops-ci/core-budget.json
        run: uv run --locked python manage.py test core_rag_budget_http_checks --noinput
      - name: Preserve actual Core trace evidence including failed scenarios
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llmops-core-search-traces-${{ github.sha }}
          path: |
            work/llmops-ci/core-search-traces.json
            work/llmops-ci/core-assistant-traces.json
            work/llmops-ci/core-evidence-traces.json
            work/llmops-ci/core-rag/
            work/llmops-ci/core-budget.json
          if-no-files-found: warn
          retention-days: 7
      - name: Register this checkout's actual Core captures for free Ops replay
        run: |
          for version in v1 v2; do
            receipt=$(backend/ai-service/.venv/bin/python -B infrastructure/llmops/register_core_rag.py "work/llmops-ci/core-rag/$version" --repository "$PWD")
            cp "$receipt" "work/llmops-ci/core-registration-$version.json"
          done
          backend/ai-service/.venv/bin/python backend/ops-service/apps/evaluations/execution_spec.py
      - name: Build isolated HTTP artifact storage, Core auth fixture, Ops and runner
        run: |
          docker compose --env-file infrastructure/llmops/.env --env-file infrastructure/llmops/.env.ops --env-file infrastructure/llmops/.env.artifacts -f infrastructure/llmops/compose.yaml -f infrastructure/llmops/compose.ops.yaml -f infrastructure/llmops/compose.artifacts.yaml -f infrastructure/llmops/compose.auth-test.yaml --profile evaluation config --format json | python3 infrastructure/llmops/check_artifact_compose.py
          docker compose --env-file infrastructure/llmops/.env --env-file infrastructure/llmops/.env.ops --env-file infrastructure/llmops/.env.artifacts -f infrastructure/llmops/compose.yaml -f infrastructure/llmops/compose.ops.yaml -f infrastructure/llmops/compose.artifacts.yaml -f infrastructure/llmops/compose.auth-test.yaml --profile evaluation up -d --build auth-core ops-artifacts ops-service evaluation-runner
      - name: Apply isolated Ops migrations
        run: docker compose --env-file infrastructure/llmops/.env --env-file infrastructure/llmops/.env.ops --env-file infrastructure/llmops/.env.artifacts -f infrastructure/llmops/compose.yaml -f infrastructure/llmops/compose.ops.yaml -f infrastructure/llmops/compose.artifacts.yaml -f infrastructure/llmops/compose.auth-test.yaml --profile evaluation exec -T ops-service python manage.py migrate_deployment
      - name: Verify Core replay image excludes raw capture evidence
        run: |
          docker compose --env-file infrastructure/llmops/.env --env-file infrastructure/llmops/.env.ops --env-file infrastructure/llmops/.env.artifacts -f infrastructure/llmops/compose.yaml -f infrastructure/llmops/compose.ops.yaml -f infrastructure/llmops/compose.artifacts.yaml -f infrastructure/llmops/compose.auth-test.yaml --profile evaluation run --rm --no-deps evaluation-runner .venv/bin/python -c '
          from pathlib import Path
          bundles = list(Path("/app/evaluation/support-program-evidence/runs").glob("core-rag-*"))
          assert len(bundles) >= 3
          assert any(bundle.name == "core-rag-20261002" for bundle in bundles)
          for bundle in bundles:
              expected = ({f"{version}/{name}.json" for version in ("v1", "v2") for name in ("fixture", "capture")}
                          if bundle.name == "core-rag-20261002" else {"source/fixture.json", "source/capture.json"})
              assert {str(p.relative_to(bundle)) for p in bundle.rglob("*") if p.is_file()} == expected
          '
      - name: Reject mismatched Ops and runner releases before model calls
        run: python3 infrastructure/llmops/spec_mismatch_smoke.py --output work/llmops-spec-mismatch.json
      - name: Verify built runner tokenizer and RAG plans without a network
        timeout-minutes: 3
        run: |
          set -euo pipefail
          image_id=$(docker compose --env-file infrastructure/llmops/.env --env-file infrastructure/llmops/.env.ops --env-file infrastructure/llmops/.env.artifacts -f infrastructure/llmops/compose.yaml -f infrastructure/llmops/compose.ops.yaml -f infrastructure/llmops/compose.artifacts.yaml -f infrastructure/llmops/compose.auth-test.yaml --profile evaluation images -q evaluation-runner)
          test -n "$image_id"
          docker run --rm --interactive --network none --read-only --memory 768m --pids-limit 64 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 \
            --entrypoint .venv/bin/python "$image_id" -B - --root /app \
            < infrastructure/llmops/check_runner_runtime.py
      - name: Start background Ops status synchronization after migrations
        run: docker compose --env-file infrastructure/llmops/.env --env-file infrastructure/llmops/.env.ops --env-file infrastructure/llmops/.env.artifacts -f infrastructure/llmops/compose.yaml -f infrastructure/llmops/compose.ops.yaml -f infrastructure/llmops/compose.artifacts.yaml -f infrastructure/llmops/compose.auth-test.yaml --profile evaluation up -d --build ops-sync
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.22.0
          runtime: node@24
          install: false
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          package-json-file: package.json
      - name: Install locked web dependencies and verify isolated restore proxy
        run: |
          pnpm install --frozen-lockfile
          node --experimental-transform-types --test infrastructure/gitops/scripts/test_ops_restore_proxy.mjs
      - name: Start React development proxy
        run: |
          (cd frontend/web && VITE_DEV_PROXY_TARGET=http://127.0.0.1:18082 VITE_CORE_API_BASE_URL=/ exec node node_modules/vite/bin/vite.js --host 127.0.0.1) > /tmp/govbiz-ops-web.log 2>&1 &
          echo "$!" > /tmp/govbiz-ops-web.pid
      - name: Verify Core admin login, Ops CSRF, duplicate requests, reports and shared logout
        shell: bash
        run: |
          set -a
          source infrastructure/llmops/.env.ops
          set +a
          export CORE_ADMIN_EMAIL=admin@govbiz.local
          export CORE_ADMIN_PASSWORD="$OPS_ADMIN_PASSWORD"
          python infrastructure/llmops/ops_smoke.py --seed-dev-accounts --base-url http://localhost:5173 --storage-transport http --output work/llmops-ci/ops-verification.json
          python infrastructure/llmops/ops_smoke.py --compare-captures --base-url http://localhost:5173 --storage-transport http --output work/llmops-ci/ops-comparison-verification.json
          LLMOPS_ISOLATED_REVIEW_TEST=1 python infrastructure/llmops/ops_smoke.py --rag-replay --rag-review-check --base-url http://localhost:5173 --storage-transport http --output work/llmops-ci/ops-rag-replay.json
          for version in v1 v2; do
            python infrastructure/llmops/ops_smoke.py --core-rag-replay "work/llmops-ci/core-registration-$version.json" --base-url http://localhost:5173 --storage-transport http --output "work/llmops-ci/ops-core-rag-$version.json"
          done
          for version in v1 v2; do
            python infrastructure/llmops/ops_smoke.py --core-snapshot-replay "$version" --base-url http://localhost:5173 --storage-transport http --output "work/llmops-ci/ops-core-snapshot-$version.json"
          done
      - name: Preserve RAG replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: llmops-rag-replay-${{ github.sha }}
          path: |
            work/llmops-ci/ops-rag-replay.json
            work/llmops-ci/core-registration-*.json
            work/llmops-ci/ops-core-rag-*.json
            work/llmops-ci/ops-core-snapshot-*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Verify failed publication recovery through Ops and Prefect without model calls
        shell: bash
        run: |
          set -a
          source infrastructure/llmops/.env.ops
          set +a
          export CORE_ADMIN_EMAIL=admin@govbiz.local
          export CORE_ADMIN_PASSWORD="$OPS_ADMIN_PASSWORD"
          dc() {
            docker compose --env-file infrastructure/llmops/.env --env-file infrastructure/llmops/.env.ops --env-file infrastructure/llmops/.env.artifacts -f infrastructure/llmops/compose.yaml -f infrastructure/llmops/compose.ops.yaml -f infrastructure/llmops/compose.artifacts.yaml -f infrastructure/llmops/compose.auth-test.yaml --profile evaluation "$@"
          }
          source_id=$(python -c 'from uuid import uuid4; print(uuid4())')
          fixture="$PWD/infrastructure/llmops/recovery_smoke_fixture.py:/tmp/recovery_smoke_fixture.py:ro"
          dc run --rm --no-deps -v "$fixture" -e OPENAI_API_KEY= -e LLMOPS_LIVE_ENABLED=false evaluation-runner .venv/bin/python /tmp/recovery_smoke_fixture.py prepare --source-id "$source_id"
          dc run --rm --no-deps -v "$fixture" ops-service python /tmp/recovery_smoke_fixture.py register --source-id "$source_id" --operator-email "$CORE_ADMIN_EMAIL"
          python infrastructure/llmops/ops_smoke.py --recover-source "$source_id" --base-url http://localhost:5173 --storage-transport http --output work/llmops-ci/ops-recovery-verification.json
          recovery_id=$(python -c 'import json; print(json.load(open("work/llmops-ci/ops-recovery-verification.json"))["request_id"])')
          dc run --rm --no-deps -v "$fixture" -e OPENAI_API_KEY= -e LLMOPS_LIVE_ENABLED=false evaluation-runner .venv/bin/python /tmp/recovery_smoke_fixture.py verify --source-id "$source_id" --recovery-id "$recovery_id"
      - name: Stop this job's development containers
        if: always()
        run: docker compose --env-file infrastructure/llmops/.env --env-file infrastructure/llmops/.env.ops --env-file infrastructure/llmops/.env.artifacts -f infrastructure/llmops/compose.yaml -f infrastructure/llmops/compose.ops.yaml -f infrastructure/llmops/compose.artifacts.yaml -f infrastructure/llmops/compose.auth-test.yaml --profile evaluation down
      - name: Stop this job's initial web proxy before Kubernetes verification
        if: always()
        run: |
          if [ -f /tmp/govbiz-ops-web.pid ]; then
            kill "$(cat /tmp/govbiz-ops-web.pid)" 2>/dev/null || true
          fi
      - name: Verify execution, cancellation, budget and free RAG recovery with offline model HTTP
        # Includes cold startup, 13 fixed-context and 6 RAG scenarios; deadlines stay strict.
        timeout-minutes: 20
        run: backend/ai-service/.venv/bin/python infrastructure/llmops/cancellation_smoke.py --output work/llmops-ci/cancellation.json
      - name: Preserve cancellation evidence including failed scenarios
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llmops-cancellation-${{ github.sha }}
          path: work/llmops-ci/cancellation.json
          if-no-files-found: warn
          retention-days: 7
      - name: Install pinned kind, kubectl and Helm for isolated Kubernetes evaluation
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          cd "$tool_dir"
          curl -fsSLO https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -fsSLO https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
          sha256sum --check kind-linux-amd64.sha256sum
          mv kind-linux-amd64 kind
          curl -fsSL https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl -o kubectl
          curl -fsSL https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl.sha256 -o kubectl.sha256
          echo "$(< kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kind kubectl
          curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz.sha256sum
          sha256sum --check helm-v4.3.0-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v4.3.0-linux-amd64.tar.gz
          mv linux-amd64/helm .
          test "$(./helm version --template '{{.Version}}')" = v4.3.0
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Verify Kubernetes evaluation, endpoint recovery and Ops DB/volume restore
        timeout-minutes: 30
        run: backend/ai-service/.venv/bin/python -B infrastructure/gitops/scripts/smoke_ops_bridge.py --evaluate --report work/llmops-ci/ops-bridge.json
      - name: Preserve isolated Compose bridge evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: llmops-ops-bridge-${{ github.sha }}
          path: work/llmops-ci/ops-bridge.json
          if-no-files-found: warn
          retention-days: 7

  merge-readiness:
    name: Required CI / LLMOps
    if: ${{ always() }}
    needs: [integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out CI policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every dependency to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -B infrastructure/release/ci_policy.py llmops-ci.yml
