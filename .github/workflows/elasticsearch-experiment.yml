name: Elasticsearch lexical experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nori-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build and start isolated Elasticsearch
        run: |
          docker compose --env-file /dev/null -f evaluation/support-program-search/elasticsearch/compose.yaml config --quiet
          docker compose --env-file /dev/null -f evaluation/support-program-search/elasticsearch/compose.yaml up --build -d --wait --wait-timeout 180

      - name: Test real Nori indexing and search without model calls
        env:
          LOCAL_ES_INTEGRATION_URL: http://127.0.0.1:19200
        run: python -B -m unittest discover -s evaluation/support-program-search -p 'test_compare_*.py'

      - name: Stop only the disposable experiment
        if: always()
        run: docker compose --env-file /dev/null -f evaluation/support-program-search/elasticsearch/compose.yaml down
