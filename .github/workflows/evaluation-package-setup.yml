name: Evaluation runner package setup

on:
  workflow_dispatch:
    inputs:
      confirm_package:
        description: 'Exact destination: ghcr.io/<owner>/<repository-lowercase>-evaluation-runner'
        required: true
        type: string

permissions:
  contents: read

# Do not race the normal runner publisher. This workflow has no automatic trigger.
concurrency:
  group: evaluation-image-candidate
  cancel-in-progress: false

jobs:
  setup:
    if: ${{ github.repository_owner != 'SKNETWORKS-FAMILY-AICAMP' && github.event.repository.owner.type == 'User' && github.event.repository.fork && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.MSA_RELEASE_ENABLED == 'true' && vars.MSA_PACKAGE_VISIBILITY == 'public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: msa-release
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      GOVBIZ_RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
      MSA_RELEASE_ENABLED: ${{ vars.MSA_RELEASE_ENABLED }}
      MSA_PACKAGE_VISIBILITY: ${{ vars.MSA_PACKAGE_VISIBILITY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare only the empty evaluation runner package after exact-source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B infrastructure/release/bootstrap_runner_actions.py --report "${RUNNER_TEMP}/evaluation-package-setup.json"
      - name: Save package setup facts without an application receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evaluation-package-setup
          path: ${{ runner.temp }}/evaluation-package-setup.json
          if-no-files-found: error
          retention-days: 30
