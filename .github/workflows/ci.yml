name: GovBiz CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Web and shared
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.22.0
          runtime: node@24
          install: false
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          package-json-file: package.json

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check shared contracts
        run: |
          pnpm --filter @govbiz/shared typecheck
          pnpm --filter @govbiz/shared test
          pnpm --filter @govbiz/shared lint

      - name: Test web and existing domain contracts
        run: pnpm --filter govbiz-web test

      - name: Lint web
        run: pnpm --filter govbiz-web lint

      - name: Build web
        run: pnpm --filter govbiz-web build

  mobile:
    name: Mobile
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.22.0
          runtime: node@24
          install: false
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          package-json-file: package.json

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check mobile types
        run: pnpm --filter @govbiz/mobile typecheck

      - name: Test mobile
        run: pnpm --filter @govbiz/mobile test

      - name: Lint mobile
        run: pnpm --filter @govbiz/mobile lint

      - name: Export iOS and Android JavaScript bundles
        run: pnpm --filter @govbiz/mobile export

  core-service:
    name: Core API
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend/core-service
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/core-service/*.gradle
            backend/core-service/gradle/wrapper/gradle-wrapper.properties

      - name: Clean build and test
        run: ./gradlew clean build --no-daemon

  ai-service:
    name: AI Service
    runs-on: ubuntu-24.04
    services:
      qdrant:
        image: qdrant/qdrant:v1.17.1
        ports:
          - 6333:6333
    env:
      QDRANT_TEST_URL: http://127.0.0.1:6333
    defaults:
      run:
        working-directory: backend/ai-service
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.11"
          working-directory: backend/ai-service
          enable-cache: true
          cache-dependency-glob: backend/ai-service/uv.lock

      - name: Check lock file
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Check installed dependencies
        run: uv pip check --python .venv/bin/python

      - name: Test
        run: uv run --locked --extra dev python -m pytest

      - name: Build package
        run: uv build

      - name: Test evidence evaluation tools without model calls
        run: uv run --locked --extra dev python -m pytest ../../evaluation/support-program-evidence

      - name: Test Compose cleanup guards without Docker mutations
        run: python -B -m unittest discover -s ../../infrastructure/scripts -p 'test_*.py'

      - name: Test backend deployment guards without AWS or Docker mutations
        run: python -B -m unittest discover -s ../../infrastructure/codebuild -p 'test_*.py'

      - name: Test MSA image publication guards without credentials or uploads
        run: python -B -m unittest discover -s ../../infrastructure/release -p 'test_*.py'

      - name: Validate retrieval evaluation fixture and metrics
        working-directory: evaluation/support-program-search
        run: ../../backend/ai-service/.venv/bin/python -m unittest discover

      - name: Test offline review tools
        working-directory: evaluation/support-program-search
        run: python -B -m unittest discover -s review -p 'test_*.py'

      - name: Verify shared evaluation run without model calls
        working-directory: evaluation/support-program-search
        run: python -B review/verify-shared-run.py --run-dir runs/support-program-catalog-20260906-v1 --with-capture

      - name: Recheck saved lexical comparison without Elasticsearch or model calls
        working-directory: evaluation/support-program-search
        run: >-
          python -B compare_elasticsearch.py
          --fixture runs/support-program-catalog-20260906-v1/review-final-v1/fixture-labeled.json
          --verify-report runs/elasticsearch-nori-20260912-v1/report.json

      - name: Recheck expanded Korean questions without model calls
        working-directory: evaluation/support-program-search
        run: >-
          python -B compare_korean_queries.py
          --fixture runs/support-program-catalog-20260906-v1/review-final-v1/fixture-labeled.json
          --questions runs/elasticsearch-korean-queries-20260912-v1/questions.json
          --verify-report runs/elasticsearch-korean-queries-20260912-v1/report.json

  container-integration:
    name: Container integration
    needs:
      - frontend
      - core-service
      - ai-service
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERIFY_COMPOSE_PROJECT_NAME: govbiz-ci
      VERIFY_COMPOSE_KEEP_RUNNING: "true"
      OPENAI_API_KEY: compose-verification-key-never-sent
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose --project-name "$VERIFY_COMPOSE_PROJECT_NAME" --file infrastructure/compose.yaml config --quiet

      - name: Verify containerized stack
        run: ./infrastructure/scripts/verify-compose.sh

      - name: Verify production Nginx boundary without external APIs
        run: python3 infrastructure/scripts/verify-production-proxy.py

      - name: Show container state and logs
        if: failure()
        run: |
          docker compose --project-name "$VERIFY_COMPOSE_PROJECT_NAME" --file infrastructure/compose.yaml ps || true
          docker compose --project-name "$VERIFY_COMPOSE_PROJECT_NAME" --file infrastructure/compose.yaml logs --no-color || true

      - name: Clean up containerized stack
        if: always()
        run: docker compose --project-name "$VERIFY_COMPOSE_PROJECT_NAME" --file infrastructure/compose.yaml down --volumes --remove-orphans
