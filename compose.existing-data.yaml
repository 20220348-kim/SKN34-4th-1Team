# 기존 개발 볼륨을 재사용할 때만 compose.yaml 뒤에 추가합니다.
# external은 없는 볼륨을 빈 데이터로 새로 만드는 대신 명시적으로 실패합니다.
# Node 의존성 캐시는 새 workspace 레이아웃으로 설치하므로 기존 web-node-modules를 연결하지 않습니다.
x-catalog-transition-review: ${GOVBIZ_CATALOG_TRANSITION_REVIEWED:?Review docs/catalog-service-extraction.md before reusing existing Core data with Catalog enabled}
volumes:
  elasticsearch-data:
    external: true
    name: ${GOVBIZ_EXISTING_ELASTICSEARCH_VOLUME:-govbiz_elasticsearch-data}
  rabbitmq-data:
    external: true
    name: ${GOVBIZ_EXISTING_RABBITMQ_VOLUME:-govbiz_rabbitmq-data}
  redis-data:
    external: true
    name: ${GOVBIZ_EXISTING_REDIS_VOLUME:-govbiz_redis-data}
  mysql-data:
    external: true
    name: ${GOVBIZ_EXISTING_MYSQL_VOLUME:-govbiz_mysql-data}
  qdrant-data:
    external: true
    name: ${GOVBIZ_EXISTING_QDRANT_VOLUME:-govbiz_qdrant-data}
  ops-mysql-data:
    external: true
    name: ${GOVBIZ_EXISTING_DJANGO_MYSQL_VOLUME:-govbiz4-django_mysql-data}
