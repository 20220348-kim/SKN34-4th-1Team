# Manual first sync. Do not apply before these paths exist in the remote revision.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: govbiz-core-service, namespace: argocd}
spec:
  project: govbiz-local-msa
  source:
    repoURL: https://github.com/SKNETWORKS-FAMILY-AICAMP/SKN34-4th-1Team.git
    targetRevision: main
    path: infrastructure/gitops/charts/govbiz-service
    helm:
      releaseName: core-service
      valueFiles: [../../environments/local-msa/core-service.yaml]
  destination: {server: https://kubernetes.default.svc, namespace: govbiz-msa}
  syncPolicy:
    syncOptions: [FailOnSharedResource=true]
