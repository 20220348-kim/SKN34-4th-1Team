apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: govbiz-portfolio-core-service, namespace: argocd}
spec:
  project: govbiz-portfolio
  source:
    repoURL: https://github.com/SKNETWORKS-FAMILY-AICAMP/SKN34-4th-1Team.git
    targetRevision: main
    path: infrastructure/gitops/charts/govbiz-service
    helm:
      releaseName: core-service
      valueFiles: [../../environments/portfolio/core-service.yaml]
  destination: {server: https://kubernetes.default.svc, namespace: govbiz-msa}
  syncPolicy:
    automated: {enabled: false, prune: false, selfHeal: false}
    syncOptions: [FailOnSharedResource=true]
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
---
