serviceName: catalog-service
localMode: false
image:
  repository: ghcr.io/govbiz-team/govbiz-catalog-service
  digest: sha256:128d4e3a8967fa0df79d2eecef5e63f44e2824bed31c3ccdcd960e3eec4d2e54
  tag: ''
  pullPolicy: IfNotPresent
imagePullSecrets:
- name: ghcr-pull
port: 8081
healthPath: /health
readyPath: /readiness
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: '2'
    memory: 1Gi
env:
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:ActiveProcessorCount=2
  SPRING_DATASOURCE_URL: jdbc:mysql://catalog-mysql:3306/govbiz_catalog
  SPRING_DATASOURCE_USERNAME: govbiz_catalog
  AI_SERVICE_BASE_URL: http://ai-service:8000
  ELASTICSEARCH_BASE_URL: http://elasticsearch:9200
  BIZINFO_SYNC_ENABLED: 'false'
  KSTARTUP_SYNC_ENABLED: 'false'
  MSIT_SYNC_ENABLED: 'false'
  CNTRADE_NOTICE_SYNC_ENABLED: 'false'
  SUPPORT_PROGRAM_INDEX_ENABLED: 'false'
secretName: catalog-runtime
secretKeys:
- SPRING_DATASOURCE_PASSWORD
- CATALOG_INTERNAL_TOKEN
- DATA_GO_KR_SERVICE_KEY
- KSTARTUP_API_KEY
- MSIT_API_KEY
- CNTRADE_NOTICE_API_KEY
