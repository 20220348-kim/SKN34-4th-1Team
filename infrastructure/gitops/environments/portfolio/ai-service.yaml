serviceName: ai-service
localMode: false
image:
  repository: ghcr.io/govbiz-team/govbiz-ai-service
  digest: sha256:ad4105aad6f39adb7de933e163441cf43d3a15165df285a85ecf70d2481ecfad
  tag: ''
  pullPolicy: IfNotPresent
imagePullSecrets:
- name: ghcr-pull
port: 8000
healthPath: /internal/v1/health
readyPath: /internal/v1/health
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: '2'
    memory: 1Gi
env:
  QDRANT_URL: http://qdrant:6333
  ASSISTANT_TOOLS_BASE_URL: http://core-service:8080
  OPENAI_BASE_URL: http://disabled-openai.invalid/v1
secretName: ai-runtime
secretKeys:
- OPENAI_API_KEY
- DOCUMENT_INTERNAL_TOKEN
- ASSISTANT_TOOLS_TOKEN
