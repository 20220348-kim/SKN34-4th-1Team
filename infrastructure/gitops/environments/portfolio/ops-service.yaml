serviceName: ops-service
localMode: false
image:
  repository: ghcr.io/govbiz-team/govbiz-ops-service
  digest: sha256:2175a1e43baf437eb28ab871db76c536a19956ef643fd6fda69e89749fa2b4d1
  tag: ''
  pullPolicy: IfNotPresent
imagePullSecrets:
- name: ghcr-pull
port: 8000
healthPath: /api/v1/health
readyPath: /api/v1/health/ready
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: '1'
    memory: 384Mi
env:
  DJANGO_DEBUG: 'false'
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,ops-service
  DB_NAME: govbiz_ops
  DB_USER: govbiz_ops
  DB_HOST: ops-mysql
  DB_PORT: '3306'
secretName: ops-runtime
secretKeys:
- DJANGO_SECRET_KEY
- DB_PASSWORD
