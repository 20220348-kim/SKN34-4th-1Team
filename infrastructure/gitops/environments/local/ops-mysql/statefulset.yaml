# Disposable local demonstration database, not an RDS replacement or HA database.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ops-mysql
  labels:
    app.kubernetes.io/name: ops-mysql
spec:
  serviceName: ops-mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ops-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops-mysql
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      containers:
        - name: mysql
          image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
          imagePullPolicy: IfNotPresent
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_0900_ai_ci
            - --innodb-buffer-pool-size=128M
            - --max-connections=30
          ports:
            - name: mysql
              containerPort: 3306
          envFrom:
            - configMapRef:
                name: ops-mysql-config
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: govbiz-ops-mysql
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: govbiz-ops-mysql
                  key: MYSQL_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - 'MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --user="$MYSQL_USER" --database="$MYSQL_DATABASE" --connect-timeout=3 --execute="SELECT 1" >/dev/null'
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 2
          livenessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
