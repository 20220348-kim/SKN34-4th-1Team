  digest: sha256:ff0ea22e5049a4a46a9c89ca512f3c10096d06c01d4f202c988e2e0e8167ff3b
  tag: ''
  pullPolicy: IfNotPresent
imagePullSecrets:
- name: ghcr-pull
port: 8000
healthPath: /internal/v1/health
readyPath: /internal/v1/health
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: '2'
