serviceName: ops-service
localMode: false
image:
  repository: ghcr.io/ilil1/skn34-4th-1team-ops-service
  digest: sha256:17a14ce0564a6477e9d5581d3aca07119e4823f8d544946b103b3d7085b1dabd
  tag: ''
  pullPolicy: IfNotPresent
imagePullSecrets:
- name: ghcr-pull
port: 8000
healthPath: /api/v1/health
readyPath: /api/v1/health/ready
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: '1'
    memory: 384Mi
env:
