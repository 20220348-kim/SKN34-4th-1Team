  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,ops-service
  DB_NAME: govbiz_ops
  DB_USER: govbiz_ops
  DB_HOST: ops-mysql
  DB_PORT: '3306'
secretName: ops-runtime
secretKeys:
- DJANGO_SECRET_KEY
- DB_PASSWORD
