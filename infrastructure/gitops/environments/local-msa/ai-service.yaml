serviceName: ai-service
localMode: true
image: {repository: govbiz-ai-service, tag: local-k8s, pullPolicy: Never}
port: 8000
healthPath: /internal/v1/health
readyPath: /internal/v1/health
resources:
  requests: {cpu: 100m, memory: 384Mi}
  limits: {cpu: "2", memory: 1Gi}
env:
  QDRANT_URL: http://qdrant:6333
  ASSISTANT_TOOLS_BASE_URL: http://core-service:8080
  # Local fixture endpoint, never the public paid API by default.
  OPENAI_BASE_URL: http://openai-stub:8002/v1
secretName: ai-runtime
secretKeys: [OPENAI_API_KEY, DOCUMENT_INTERNAL_TOKEN, ASSISTANT_TOOLS_TOKEN]
