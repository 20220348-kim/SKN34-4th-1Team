serviceName: core-service
localMode: true
image: {repository: govbiz-core-service, tag: local-k8s, pullPolicy: Never}
port: 8080
healthPath: /api/v1/health
# Process health only; dependency readiness is a remaining application task.
readyPath: /api/v1/health
resources:
  requests: {cpu: 100m, memory: 512Mi}
  limits: {cpu: "2", memory: 1Gi}
env:
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:ActiveProcessorCount=2
  SPRING_DATASOURCE_URL: jdbc:mysql://core-mysql:3306/govbiz_core
  SPRING_DATASOURCE_USERNAME: govbiz_core
  CATALOG_SERVICE_URL: http://catalog-service:8081
  CATALOG_PROJECTION_ENABLED: "true"
  CATALOG_PROJECTION_INITIAL_DELAY: PT5S
  CATALOG_PROJECTION_FIXED_DELAY: PT10S
  AI_SERVICE_BASE_URL: http://ai-service:8000
  ELASTICSEARCH_BASE_URL: http://elasticsearch:9200
  REDIS_HOST: redis
  ACCOUNT_COOKIE_SECURE: "false"
  ACCOUNT_DEV_LOGIN_ENABLED: "false"
  ACCOUNT_PASSWORD_RESET_MAIL_ENABLED: "false"
  BIZINFO_SYNC_ENABLED: "false"
  KSTARTUP_SYNC_ENABLED: "false"
  MSIT_SYNC_ENABLED: "false"
  CNTRADE_NOTICE_SYNC_ENABLED: "false"
  SUPPORT_PROGRAM_INDEX_ENABLED: "false"
  APPLICATION_FORM_ANALYSIS_ENABLED: "false"
  DAILY_REPORT_ENABLED: "false"
  DAILY_REPORT_MAIL_ENABLED: "false"
  DAILY_REPORT_QUEUE_ENABLED: "false"
  DAILY_REPORT_DELIVERY_QUEUE_ENABLED: "false"
  COMBINATION_REVIEW_QUEUE_ENABLED: "false"
  APPLICATION_FORM_DISCOVERY_QUEUE_ENABLED: "false"
  ACCOUNT_OAUTH_UNLINK_QUEUE_ENABLED: "false"
  ASSISTANT_PREFETCH_QUEUE_ENABLED: "false"
  ASSISTANT_AGENT_ENABLED: "false"
secretName: core-runtime
secretKeys: [SPRING_DATASOURCE_PASSWORD, ACCOUNT_JWT_SECRET, CATALOG_INTERNAL_TOKEN, DOCUMENT_INTERNAL_TOKEN, ASSISTANT_TOOLS_TOKEN]
