# Source-built local image only; remote deployments must select a verified digest.
serviceName: web
localMode: true
image: {repository: govbiz-web, tag: local-k8s, pullPolicy: Never}
port: 8080
healthPath: /healthz
readyPath: /healthz
runAsUser: 101
runAsGroup: 101
resources:
  requests: {cpu: 25m, memory: 32Mi}
  limits: {cpu: '1', memory: 128Mi}
temporaryStorage: 32Mi
