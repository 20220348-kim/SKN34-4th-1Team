{{- $component := .Values.component -}}
{{- if ne .Release.Name $component -}}
  {{- fail "Use the component name as its independent release name" -}}
{{- end -}}
{{- if not (regexMatch `^govbiz-evaluation(-[a-z0-9]+)*$` .Release.Namespace) -}}
  {{- fail "Use a separate govbiz-evaluation namespace" -}}
{{- end -}}
{{- $images := list .Values.image -}}
{{- if eq $component "ops-artifacts" -}}
  {{- $images = append $images .Values.evidenceImage -}}
{{- else if .Values.evidenceImage -}}
  {{- fail "evidenceImage is only used by ops-artifacts" -}}
{{- end -}}
{{- range $image := $images -}}
  {{- if $.Values.allowLocalImages -}}
    {{- if not (regexMatch `^govbiz/[a-z0-9-]+:[a-z0-9][a-z0-9.-]+$` $image) -}}
      {{- fail "Local CI images require an explicit govbiz/name:tag" -}}
    {{- end -}}
    {{- if hasSuffix ":latest" $image -}}{{- fail "latest is not allowed" -}}{{- end -}}
  {{- else if not (regexMatch `^[a-z0-9][a-z0-9./:_-]*@sha256:[a-f0-9]{64}$` $image) -}}
    {{- fail "An immutable image@sha256 digest is required" -}}
  {{- end -}}
{{- end -}}
{{- if eq $component "evaluation-runner" -}}
  {{- range $url := list .Values.runner.opsApiUrl .Values.runner.langfuseUrl -}}
    {{- if not (regexMatch `^https?://[a-zA-Z0-9][a-zA-Z0-9.-]*(:[0-9]+)?$` $url) -}}
      {{- fail "Runner endpoints require an HTTP origin without credentials or a path" -}}
    {{- end -}}
    {{- if regexMatch `(?i)^https?://(localhost|127\.[0-9.]+|[^/:]*\.invalid)(:[0-9]+)?$` $url -}}
      {{- fail "Runner endpoints must be reachable service addresses" -}}
    {{- end -}}
  {{- end -}}
{{- else if or .Values.runner.opsApiUrl .Values.runner.langfuseUrl -}}
  {{- fail "Runner endpoints must not be passed to other components" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $component }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  strategy: {type: Recreate}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $component }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $component }}}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.storage.node | quote }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      {{- if eq $component "prefect" }}
      initContainers:
        - name: restored-prefect-database
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ ternary "Never" "IfNotPresent" .Values.allowLocalImages }}
          command:
            - python
            - -c
            - |
              import sqlite3, sys
              from pathlib import Path
              path = Path(sys.argv[1])
              if not path.is_file() or path.is_symlink():
                  raise SystemExit('A restored Prefect database is required')
              with sqlite3.connect(path.as_uri() + '?mode=ro', uri=True) as db:
                  db.execute('PRAGMA query_only=ON')
                  if db.execute('PRAGMA integrity_check').fetchall() != [('ok',)]:
                      raise SystemExit('Prefect database integrity failed')
                  if db.execute('PRAGMA foreign_key_check').fetchall():
                      raise SystemExit('Prefect references are invalid')
                  migrations = db.execute('SELECT version_num FROM alembic_version').fetchall()
                  if not migrations or any(not row[0] for row in migrations):
                      raise SystemExit('Prefect migration history is missing')
                  # Check expected tables without blocking recovery of running flows.
                  db.execute('SELECT active FROM deployment_schedule LIMIT 0')
                  db.execute('SELECT state_type FROM flow_run LIMIT 0')
            - /data/prefect.db
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            # SQLite may need WAL/SHM even for mode=ro. Use only a restored copy.
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      {{- else if eq $component "ops-artifacts" }}
      # The Ops image does not contain evaluation fixtures. Copy the matching
      # runner image's immutable fixtures, never a host checkout or ConfigMap.
      initContainers:
        - name: evaluation-evidence
          image: {{ .Values.evidenceImage | quote }}
          imagePullPolicy: {{ ternary "Never" "IfNotPresent" .Values.allowLocalImages }}
          command:
            - /app/backend/ai-service/.venv/bin/python
            - -c
            - "import shutil; shutil.copytree('/app/evaluation/support-program-evidence', '/evidence', dirs_exist_ok=True)"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: evidence, mountPath: /evidence}
            - {name: tmp, mountPath: /tmp}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ ternary "Never" "IfNotPresent" .Values.allowLocalImages }}
          {{- if eq $component "prefect" }}
          workingDir: /tmp
          command: [prefect, server, start, --host, "0.0.0.0", --port, "4200", --no-services, --analytics-off]
          ports: [{name: http, containerPort: 4200}]
          env:
            - {name: HOME, value: /tmp}
            - {name: PREFECT_HOME, value: /tmp/prefect}
            - {name: PREFECT_SERVER_DATABASE_CONNECTION_URL, value: "sqlite+aiosqlite:////data/prefect.db"}
            - {name: PREFECT_API_DATABASE_MIGRATE_ON_START, value: "false"}
            - {name: PREFECT_API_BLOCKS_REGISTER_ON_START, value: "false"}
            - {name: PREFECT_SERVER_ANALYTICS_ENABLED, value: "false"}
            - {name: PREFECT_SERVER_SERVICES_SCHEDULER_ENABLED, value: "false"}
            - {name: PREFECT_SERVER_SERVICES_LATE_RUNS_ENABLED, value: "false"}
            - {name: PREFECT_SERVER_ALLOW_EPHEMERAL_MODE, value: "false"}
            - {name: PREFECT_SERVER_UI_ENABLED, value: "false"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          {{- else if eq $component "ops-artifacts" }}
          command: [gunicorn, "apps.evaluations.artifact_server:create_app()", --bind, "0.0.0.0:8010", --workers, "2", --timeout, "15", --worker-tmp-dir, /tmp, --error-logfile, "-"]
          ports: [{name: http, containerPort: 8010}]
          env:
            - {name: LLMOPS_RESULTS_DIR, value: /results}
            - {name: LLMOPS_EVIDENCE_DIR, value: /evaluation-data}
            - name: LLMOPS_ARTIFACT_TOKEN
              valueFrom:
                secretKeyRef: {name: llmops-artifacts, key: LLMOPS_ARTIFACT_TOKEN}
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import json,os,urllib.request; c=urllib.request.build_opener(urllib.request.ProxyHandler({})); r=urllib.request.Request('http://127.0.0.1:8010/v1/status',headers={'Authorization':'Bearer '+os.environ['LLMOPS_ARTIFACT_TOKEN']}); assert json.load(c.open(r,timeout=2))['results_readable'] is True"
            periodSeconds: 5
            timeoutSeconds: 3
          {{- else }}
          workingDir: /app/backend/ai-service
          command: [/app/backend/ai-service/.venv/bin/python, /app/evaluation/support-program-evidence/ops_flow.py]
          env:
            - {name: HOME, value: /tmp}
            - {name: PREFECT_HOME, value: /tmp/prefect}
            - {name: PREFECT_API_URL, value: "http://prefect:4200/api"}
            - {name: PREFECT_SERVER_ALLOW_EPHEMERAL_MODE, value: "false"}
            - {name: PREFECT_SERVER_ANALYTICS_ENABLED, value: "false"}
            - {name: DO_NOT_TRACK, value: "1"}
            - {name: LLMOPS_RESULTS_DIR, value: /results}
            - {name: LLMOPS_LIVE_ENABLED, value: "false"}
            - {name: LLMOPS_RAG_LIVE_ENABLED, value: "false"}
            - {name: LLMOPS_SCHEDULES_ENABLED, value: "false"}
            - {name: OPENAI_API_KEY, value: ""}
            - {name: LLMOPS_OPS_API_URL, value: {{ .Values.runner.opsApiUrl | quote }}}
            - {name: LANGFUSE_ENABLED, value: "true"}
            - {name: LANGFUSE_BASE_URL, value: {{ .Values.runner.langfuseUrl | quote }}}
            - {name: LANGFUSE_ENVIRONMENT, value: development}
            {{- range $key := list "LLMOPS_BUDGET_TOKEN" "LANGFUSE_PUBLIC_KEY" "LANGFUSE_SECRET_KEY" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef: {name: llmops-runner, key: {{ $key }}}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - name: data
              mountPath: {{ ternary "/data" "/results" (eq $component "prefect") }}
              readOnly: {{ eq $component "ops-artifacts" }}
            {{- if eq $component "ops-artifacts" }}
            - {name: evidence, mountPath: /evaluation-data, readOnly: true}
            {{- else if eq $component "evaluation-runner" }}
            - {name: work, mountPath: /app/work}
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.storage.existingClaim }}
            readOnly: {{ eq $component "ops-artifacts" }}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
        {{- if eq $component "ops-artifacts" }}
        - name: evidence
          emptyDir: {sizeLimit: 128Mi}
        {{- else if eq $component "evaluation-runner" }}
        - name: work
          emptyDir: {sizeLimit: 512Mi}
        {{- end }}
{{- if ne $component "evaluation-runner" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $component }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: {{ $component }}}
  ports:
    - name: http
      port: {{ ternary 4200 8010 (eq $component "prefect") }}
      targetPort: http
{{- end }}
