{{- $component := .Values.component -}}
{{- $langfuse := .Values.runner.langfuseUrl -}}
{{- $langfuseService := "http://langfuse-web.govbiz-observability.svc.cluster.local:3000" -}}
{{- if eq $component "evaluation-runner" -}}
  {{- if ne .Values.runner.opsApiUrl "http://ops-service.govbiz-msa.svc.cluster.local:8000" -}}
    {{- fail "Runner Ops URL must match its Kubernetes egress peer" -}}
  {{- end -}}
  {{- $octet := `(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])` -}}
  {{- $privateOrigin := printf `^http://(10\.%s\.%s\.%s|172\.(1[6-9]|2[0-9]|3[01])\.%s\.%s|192\.168\.%s\.%s):3000$` $octet $octet $octet $octet $octet $octet $octet -}}
  {{- if and (ne $langfuse $langfuseService) (not (regexMatch $privateOrigin $langfuse)) -}}
    {{- fail "Use the Langfuse Kubernetes origin or an RFC1918 IPv4 origin on port 3000" -}}
  {{- end -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $component }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: {{ $component }}}
  policyTypes: [Ingress, Egress]
  {{- if eq $component "evaluation-runner" }}
  ingress: []
  {{- else }}
  ingress:
    - from:
        # Both selectors must match: another namespace's ops-service is denied.
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: govbiz-msa}
          podSelector:
            matchLabels: {app.kubernetes.io/name: ops-service}
        {{- if eq $component "prefect" }}
        # podSelector alone is restricted to this evaluation namespace.
        - podSelector:
            matchLabels: {app.kubernetes.io/name: evaluation-runner}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ ternary 4200 8010 (eq $component "prefect") }}
  {{- end }}
  {{- if eq $component "evaluation-runner" }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: prefect}
      ports:
        - {protocol: TCP, port: 4200}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: govbiz-msa}
          podSelector:
            matchLabels: {app.kubernetes.io/name: ops-service}
      ports:
        - {protocol: TCP, port: 8000}
    - to:
        {{- if eq $langfuse $langfuseService }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: govbiz-observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: langfuse-web}
        {{- else }}
        - ipBlock:
            cidr: {{ trimSuffix ":3000" (trimPrefix "http://" $langfuse) }}/32
        {{- end }}
      ports:
        - {protocol: TCP, port: 3000}
  {{- else }}
  egress: []
  {{- end }}
