# One release per component. No PVC, Secret, namespace or migration ownership.
component: ""
replicas: 0
image: ""
# Disposable CI clusters only. Real candidates require immutable image references.
allowLocalImages: false
evidenceImage: ""
imagePullSecrets: []
storage:
  existingClaim: ""
  # The runner and artifact server share one ReadWriteOnce claim on this node.
  node: ""
runner:
  opsApiUrl: ""
  langfuseUrl: ""
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: "1", memory: 1Gi}
