{{- range $name, $store := .Values.stores }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: {{ $name }}}
  ports: [{name: store, port: {{ $store.port }}, targetPort: store}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $name }}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $store.uid }}
        runAsGroup: {{ $store.uid }}
        fsGroup: {{ $store.uid }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $name }}
          image: {{ $store.image }}
          imagePullPolicy: {{ $store.pullPolicy | default "IfNotPresent" }}
          {{- if $store.args }}
          args: {{ $store.args | toJson }}
          {{- end }}
          ports: [{name: store, containerPort: {{ $store.port }}}]
          {{- if $store.env }}
          env:
            {{- range $key, $value := $store.env }}
            - {name: {{ $key }}, value: {{ $value | quote }}}
            {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: {{ $store.memory }}}
          startupProbe:
            tcpSocket: {port: store}
            periodSeconds: 5
            failureThreshold: 90
          readinessProbe:
            tcpSocket: {port: store}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: store}
            periodSeconds: 15
            failureThreshold: 5
          volumeMounts:
            - {name: data, mountPath: {{ $store.directory }}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
{{- end }}
