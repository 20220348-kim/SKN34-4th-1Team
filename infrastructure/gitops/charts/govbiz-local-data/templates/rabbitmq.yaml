{{- if .Values.rabbitmq.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: amqp}
    - {name: management, port: 15672, targetPort: management}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: rabbitmq
  replicas: 1
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels: {app.kubernetes.io/name: rabbitmq}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rabbitmq}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          ports:
            - {name: amqp, containerPort: 5672}
            - {name: management, containerPort: 15672}
          env:
            - {name: RABBITMQ_DEFAULT_USER, value: govbiz}
            - {name: RABBITMQ_DEFAULT_VHOST, value: govbiz}
            - {name: RABBITMQ_NODENAME, value: rabbit@rabbitmq-0}
            - {name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS, value: "+S 2:2 +sbwt none +sbwtdcpu none +sbwtdio none"}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: {name: {{ .Values.rabbitmq.secretName }}, key: RABBITMQ_PASSWORD}
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef: {name: {{ .Values.rabbitmq.secretName }}, key: RABBITMQ_ERLANG_COOKIE}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            tcpSocket: {port: amqp}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          # RabbitMQ recommends AMQP TCP readiness and no liveness probe.
          # Repeated CLI probes launch/join Erlang VMs and can restart a healthy
          # broker under local-machine load. Process exits still restart normally.
          readinessProbe:
            tcpSocket: {port: amqp}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - {name: data, mountPath: /var/lib/rabbitmq}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
{{- end }}
