{{- if not .Values.allowDisposableData }}
{{- fail "This chart is only for explicitly approved disposable local data" }}
{{- end }}
{{- range $name, $db := .Values.databases }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-mysql
  namespace: {{ $.Release.Namespace }}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: {{ $name }}-mysql}
  ports: [{name: mysql, port: 3306, targetPort: mysql}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-mysql
  namespace: {{ $.Release.Namespace }}
spec:
  serviceName: {{ $name }}-mysql
  replicas: 1
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}-mysql}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $name }}-mysql}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mysql
          image: {{ $.Values.mysqlImage }}
          args: [--character-set-server=utf8mb4, --collation-server=utf8mb4_0900_ai_ci, --innodb-buffer-pool-size=67108864, --mysqlx=0, --performance-schema=OFF]
          ports: [{name: mysql, containerPort: 3306}]
          env:
            - {name: MYSQL_DATABASE, value: {{ $db.database }}}
            - {name: MYSQL_USER, value: {{ $db.user }}}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $name }}-mysql-runtime, key: MYSQL_PASSWORD}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $name }}-mysql-runtime, key: MYSQL_ROOT_PASSWORD}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 640Mi}
          startupProbe:
            exec:
              command: [sh, -c, 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$MYSQL_USER" "$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -c, 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$MYSQL_USER" "$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: {port: mysql}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
{{- end }}
