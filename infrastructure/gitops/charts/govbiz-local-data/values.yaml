allowDisposableData: false
mysqlImage: mysql:8.4
databases:
  core: {database: govbiz_core, user: govbiz_core}
  catalog: {database: govbiz_catalog, user: govbiz_catalog}
  ops: {database: govbiz_ops, user: govbiz_ops}
stores:
  redis:
    image: redis:8.2.9-alpine
    port: 6379
    uid: 999
    directory: /data
    args: [redis-server, --appendonly, "yes", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    env: {}
    memory: 256Mi
  qdrant:
    image: qdrant/qdrant:v1.17.1
    port: 6333
    uid: 10001
    directory: /qdrant/storage
    args: []
    env:
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
      QDRANT__TELEMETRY_DISABLED: "true"
    memory: 512Mi
  elasticsearch:
    image: govbiz-elasticsearch:local-k8s
    pullPolicy: Never
    port: 9200
    uid: 1000
    directory: /usr/share/elasticsearch/data
    args: []
    env:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      action.auto_create_index: "false"
      node.store.allow_mmap: "false"
      ES_JAVA_OPTS: -Xms256m -Xmx256m
    memory: 1536Mi
