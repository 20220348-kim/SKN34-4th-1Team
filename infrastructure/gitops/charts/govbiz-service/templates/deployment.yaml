{{- $repository := required "image.repository is required" .Values.image.repository -}}
{{- $image := "" -}}
{{- if .Values.image.digest -}}
  {{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.image.digest) -}}
    {{- fail "image.digest must be a sha256 digest" -}}
  {{- end -}}
  {{- $image = printf "%s@%s" $repository .Values.image.digest -}}
{{- else if and .Values.localMode .Values.image.tag (ne .Values.image.tag "latest") -}}
  {{- $image = printf "%s:%s" $repository .Values.image.tag -}}
{{- else -}}
  {{- fail "A digest is required outside localMode; local tags must not be latest" -}}
{{- end -}}
{{- if ne (int .Values.replicas) 1 -}}
  {{- fail "replicas must remain 1 until distributed writers and admission are verified" -}}
{{- end -}}
{{- if not (has .Values.serviceName (list "core-service" "catalog-service" "ai-service" "ops-service")) -}}
  {{- fail "Unknown GovBiz serviceName" -}}
{{- end -}}
{{- range $key, $value := .Values.env -}}
  {{- if regexMatch "(?i)(PASSWORD|SECRET|TOKEN|API_KEY|SERVICE_KEY|PRIVATE_KEY)$" $key -}}
    {{- fail (printf "%s must be injected through secretKeys, not env" $key) -}}
  {{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.serviceName }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # RollingUpdate can overlap writers even with replica=1. Accept brief downtime.
  strategy: {type: Recreate}
  minReadySeconds: 3
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.serviceName }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.serviceName }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ required "imagePullSecrets entry requires a name" .name | quote }}
        {{- end }}
      {{- end }}
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.runAsUser }}
        runAsGroup: {{ .Values.runAsGroup }}
        fsGroup: {{ .Values.runAsGroup }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ .Values.serviceName }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ .Values.port }}}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range .Values.secretKeys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ required "secretName is required for secretKeys" $.Values.secretName }}
                  key: {{ . }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: {{ .Values.readyPath }}
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 5
            timeoutSeconds: 8
            failureThreshold: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: {{ .Values.temporaryStorage }}}
