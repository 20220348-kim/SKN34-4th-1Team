{{- include "observability.validate" . -}}
{{- range $name := list "postgres" "clickhouse" "redis" "minio" }}
{{- $uid := index (dict "postgres" 999 "clickhouse" 101 "redis" 999 "minio" 65532) $name }}
{{- $path := index (dict "postgres" "/var/lib/postgresql/data" "clickhouse" "/var/lib/clickhouse" "redis" "/data" "minio" "/data") $name }}
{{- $port := index (dict "postgres" 5432 "clickhouse" 8123 "redis" 6379 "minio" 9000) $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: {{ $name }}}
  ports:
    - {name: service, port: {{ $port }}, targetPort: service}
    {{- if eq $name "clickhouse" }}
    - {name: native, port: 9000, targetPort: native}
    {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  serviceName: {{ $name }}
  replicas: {{ index $.Values.replicas $name }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $name }}}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: {{ $.Values.node | quote }}}
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $uid }}
        runAsGroup: {{ $uid }}
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: require-restored-data
          image: {{ $.Values.restoreHelperImage | quote }}
          command:
            - python
            - -B
            - -c
            - |
              import json,pathlib
              root=pathlib.Path('/restored')
              record=json.loads((root/'.govbiz-langfuse-restore.json').read_text())
              assert record['component']=={{ $name | quote }}
              assert record['image']=={{ index $.Values.images $name | quote }}
              required={{ index (dict "postgres" "PG_VERSION" "clickhouse" "metadata/default.sql" "redis" "dump.rdb" "minio" ".minio.sys/format.json") $name | quote }}
              assert (root/required).is_file()
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: data, mountPath: /restored, readOnly: true}]
      containers:
        - name: {{ $name }}
          image: {{ index $.Values.images $name | quote }}
          imagePullPolicy: IfNotPresent
          {{- if eq $name "postgres" }}
          args: [postgres, -c, unix_socket_directories=/tmp]
          {{- else if eq $name "redis" }}
          command: [sh, -ec, 'exec redis-server --requirepass "$REDISCLI_AUTH" --maxmemory-policy noeviction']
          {{- else if eq $name "minio" }}
          command: [minio, server, --address, ":9000", /data]
          {{- end }}
          ports:
            - {name: service, containerPort: {{ $port }}}
            {{- if eq $name "clickhouse" }}
            - {name: native, containerPort: 9000}
            {{- end }}
          env:
            {{- if eq $name "postgres" }}
            - {name: POSTGRES_USER, value: langfuse}
            - {name: POSTGRES_DB, value: langfuse}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $.Values.existingStorageSecret }}, key: POSTGRES_PASSWORD}}
            {{- else if eq $name "clickhouse" }}
            - {name: CLICKHOUSE_USER, value: langfuse}
            - name: CLICKHOUSE_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $.Values.existingStorageSecret }}, key: CLICKHOUSE_PASSWORD}}
            {{- else if eq $name "redis" }}
            - name: REDISCLI_AUTH
              valueFrom: {secretKeyRef: {name: {{ $.Values.existingStorageSecret }}, key: REDIS_PASSWORD}}
            {{- else }}
            - {name: MINIO_ROOT_USER, value: langfuse}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $.Values.existingStorageSecret }}, key: MINIO_PASSWORD}}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml (index $.Values.resources $name) | nindent 12 }}
          startupProbe:
            tcpSocket: {port: service}
            periodSeconds: 5
            failureThreshold: 48
          readinessProbe:
            {{- if eq $name "postgres" }}
            exec: {command: [pg_isready, -h, "127.0.0.1", -U, langfuse, -d, langfuse]}
            {{- else if eq $name "redis" }}
            exec: {command: [redis-cli, ping]}
            {{- else if eq $name "clickhouse" }}
            httpGet: {path: /ping, port: service}
            {{- else }}
            httpGet: {path: /minio/health/ready, port: service}
            {{- end }}
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - {name: data, mountPath: {{ $path }}}
            {{- if eq $name "clickhouse" }}
            - {name: memory, mountPath: /etc/clickhouse-server/config.d/memory.xml, subPath: memory.xml, readOnly: true}
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ index $.Values.claims $name }}}
        {{- if eq $name "clickhouse" }}
        - {name: memory, configMap: {name: clickhouse-memory}}
        {{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: clickhouse-memory, namespace: {{ .Release.Namespace }}}
data:
  memory.xml: |
    <clickhouse>
      <max_server_memory_usage>2147483648</max_server_memory_usage>
      <mark_cache_size>134217728</mark_cache_size>
      <memory_worker_correct_memory_tracker>1</memory_worker_correct_memory_tracker>
    </clickhouse>
