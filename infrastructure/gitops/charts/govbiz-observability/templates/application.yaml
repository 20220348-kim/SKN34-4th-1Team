{{- include "observability.validate" . -}}
{{- range $name := list "langfuse-web" "langfuse-worker" }}
{{- $port := ternary 3000 3030 (eq $name "langfuse-web") }}
---
apiVersion: v1
kind: Service
metadata: {name: {{ $name }}, namespace: {{ $.Release.Namespace }}}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: {{ $name }}}
  ports: [{name: http, port: {{ $port }}, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ $name }}, namespace: {{ $.Release.Namespace }}}
spec:
  replicas: {{ index $.Values.replicas $name }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $name }}}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: {{ $.Values.node | quote }}}
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 65533
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $name }}
          image: {{ index $.Values.images $name | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: {{ $port }}}]
          env:
            {{- range $key := list "DATABASE_URL" "SALT" "ENCRYPTION_KEY" "NEXTAUTH_SECRET" "CLICKHOUSE_PASSWORD" "REDIS_AUTH" "LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY" "LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY" }}
            - name: {{ $key }}
              valueFrom: {secretKeyRef: {name: {{ $.Values.existingAppSecret }}, key: {{ $key }}}}
            {{- end }}
            - {name: HOSTNAME, value: "0.0.0.0"}
            - {name: NEXTAUTH_URL, value: {{ $.Values.publicUrl | quote }}}
            - {name: TELEMETRY_ENABLED, value: "false"}
            - {name: LANGFUSE_IN_APP_AGENT_ENABLED, value: "false"}
            - {name: LANGFUSE_AUTO_POSTGRES_MIGRATION_DISABLED, value: "true"}
            - {name: LANGFUSE_AUTO_CLICKHOUSE_MIGRATION_DISABLED, value: "true"}
            - {name: CLICKHOUSE_MIGRATION_URL, value: "clickhouse://clickhouse:9000"}
            - {name: CLICKHOUSE_URL, value: "http://clickhouse:8123"}
            - {name: CLICKHOUSE_USER, value: langfuse}
            - {name: CLICKHOUSE_CLUSTER_ENABLED, value: "false"}
            - {name: REDIS_HOST, value: redis}
            - {name: REDIS_PORT, value: "6379"}
            {{- range $kind := list "EVENT" "MEDIA" }}
            - {name: LANGFUSE_S3_{{ $kind }}_UPLOAD_BUCKET, value: langfuse}
            - {name: LANGFUSE_S3_{{ $kind }}_UPLOAD_REGION, value: auto}
            - {name: LANGFUSE_S3_{{ $kind }}_UPLOAD_ACCESS_KEY_ID, value: langfuse}
            - {name: LANGFUSE_S3_{{ $kind }}_UPLOAD_ENDPOINT, value: "http://minio:9000"}
            - {name: LANGFUSE_S3_{{ $kind }}_UPLOAD_FORCE_PATH_STYLE, value: "true"}
            {{- end }}
            - {name: LANGFUSE_S3_EVENT_UPLOAD_PREFIX, value: events/}
            - {name: LANGFUSE_S3_MEDIA_UPLOAD_PREFIX, value: media/}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml (index $.Values.resources $name) | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ ternary "/api/public/health?failIfDatabaseUnavailable=true" "/api/health" (eq $name "langfuse-web") | quote }}
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 48
          readinessProbe:
            httpGet:
              path: {{ ternary "/api/public/health?failIfDatabaseUnavailable=true" "/api/health" (eq $name "langfuse-web") | quote }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
{{- end }}
