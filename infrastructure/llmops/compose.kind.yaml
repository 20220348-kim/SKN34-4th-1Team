# Add after compose.artifacts.yaml. No host ports or shared default kind network.
services:
  prefect:
    networks:
      default: {}
      ops-bridge: {}
  ops-artifacts:
    networks:
      default: {}
      ops-bridge: {}
  evaluation-runner:
    # Ops and its DB run in Kubernetes. Keep Prefect/Langfuse readiness dependencies,
    # but do not initialize or start a second Ops database through the local seed job.
    depends_on:
      ops-bootstrap: !reset null

networks:
  ops-bridge:
    name: ${GOVBIZ_OPS_BRIDGE_NETWORK:?Run ops_bridge.py env}
    driver: bridge
    internal: true
    labels:
      dev.govbiz.state-id: ${GOVBIZ_OPS_BRIDGE_STATE_ID:?Run ops_bridge.py env}
