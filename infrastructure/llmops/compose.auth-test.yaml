# LLMOps CI에서만 쓰는 실제 Core 인증 fixture. 기존 개발 회원 DB와 볼륨을 공유하지 않는다.
services:
  auth-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: govbiz_auth_fixture
      MYSQL_USER: govbiz_fixture
      MYSQL_PASSWORD: ${OPS_DB_PASSWORD:?Run init_ops_env.py}
      MYSQL_ROOT_PASSWORD: ${OPS_DB_ROOT_PASSWORD:?Run init_ops_env.py}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -u govbiz_fixture -D govbiz_auth_fixture -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
  auth-core:
    build: ../../backend/core-service
    ports: ["127.0.0.1:18082:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://auth-mysql:3306/govbiz_auth_fixture
      SPRING_DATASOURCE_USERNAME: govbiz_fixture
      SPRING_DATASOURCE_PASSWORD: ${OPS_DB_PASSWORD}
      ACCOUNT_JWT_SECRET: ${OPS_ADMIN_PASSWORD:?Run init_ops_env.py}
      ACCOUNT_COOKIE_SECURE: "false"
      ACCOUNT_DEV_LOGIN_ENABLED: "true"
      ACCOUNT_DEV_LOGIN_EMAIL: admin@govbiz.local
      ACCOUNT_DEV_LOGIN_PASSWORD: ${OPS_ADMIN_PASSWORD}
      BIZINFO_SYNC_ENABLED: "false"
      KSTARTUP_SYNC_ENABLED: "false"
      MSIT_SYNC_ENABLED: "false"
      CNTRADE_NOTICE_SYNC_ENABLED: "false"
      SUPPORT_PROGRAM_INDEX_ENABLED: "false"
      ACCOUNT_OAUTH_UNLINK_ENABLED: "false"
      ACCOUNT_OAUTH_UNLINK_QUEUE_ENABLED: "false"
    depends_on:
      auth-mysql: {condition: service_healthy}
  ops-service:
    environment:
      CORE_API_URL: http://auth-core:8080
