# cancellation_smoke.py가 생성한 일회용 프로젝트에서만 사용하는 테스트 오버레이.
# 운영 이미지/소스는 그대로 사용하고, HTTP 모델 대역과 장애 주입기는 읽기 전용으로 마운트한다.
services:
  # 취소·예산 검사는 빈 장부로 시작한다. 공유 검토 seed의 과거 유료 실행은 이 시험에 넣지 않는다.
  ops-bootstrap:
    environment:
      LLMOPS_LOCAL_SEED_ENABLED: "false"
    command: ["python", "manage.py", "migrate", "--noinput"]
  langfuse-web:
    ports: !reset []
  prefect:
    ports: !reset []
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 90
  ops-service:
    ports: !reset []
    extra_hosts: !reset []
    environment:
      CORE_API_URL: http://cancellation-probe:8099
      PREFECT_API_URL: http://cancellation-probe:8099/api
      LLMOPS_LIVE_ENABLED: "true"
      LLMOPS_RAG_LIVE_ENABLED: "true"
      LLMOPS_BUDGET_TOKEN: offline-cancellation-test-token-not-for-deployment
    volumes:
      - ./cancellation_probe.py:/test/cancellation_probe.py:ro
  evaluation-runner:
    command: [".venv/bin/python", "/test/cancellation_runner.py"]
    restart: "no"
    depends_on:
      prefect: {condition: service_healthy}
      cancellation-probe: {condition: service_healthy}
    environment:
      OPENAI_API_KEY: offline-model-double-key
      LLMOPS_LIVE_ENABLED: "true"
      LLMOPS_RAG_LIVE_ENABLED: "true"
      LLMOPS_BUDGET_TOKEN: offline-cancellation-test-token-not-for-deployment
      LLMOPS_OPS_API_URL: http://cancellation-probe:8099
      PREFECT_RUNNER_POLL_FREQUENCY: "1"
      PREFECT_RUNNER_PROCESS_LIMIT: "1"
    volumes:
      - ./cancellation_runner.py:/test/cancellation_runner.py:ro
  cancellation-probe:
    build: ../../backend/ops-service
    init: true
    command: ["python", "/test/cancellation_probe.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./cancellation_probe.py:/test/cancellation_probe.py:ro

# 호스트 포트 게시 없이 docker compose exec로 내부 HTTP를 호출한다.
# 모델 대역의 전송 경로 검증과 별개로 모든 테스트 컨테이너의 외부 egress를 차단한다.
networks:
  default:
    internal: true
