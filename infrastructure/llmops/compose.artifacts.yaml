# compose.yaml + compose.ops.yaml 뒤에 추가한다. Compose 2.24.4 이상 필요.
# 기존 결과 볼륨의 쓰기는 runner만 수행한다. Ops는 파일 마운트 없이 HTTP로 읽는다.
services:
  ops-artifacts:
    build: ../../backend/ops-service
    init: true
    command: ["gunicorn", "apps.evaluations.artifact_server:create_app()", "--bind", "0.0.0.0:8010", "--workers", "2", "--timeout", "15", "--worker-tmp-dir", "/tmp", "--error-logfile", "-"]
    environment:
      LLMOPS_ARTIFACT_TOKEN: ${LLMOPS_ARTIFACT_TOKEN:?Generate .env.artifacts with init_ops_env.py --artifacts}
      LLMOPS_RESULTS_DIR: /results
      LLMOPS_EVIDENCE_DIR: /evaluation-data
    volumes:
      - ops-results:/results:ro
      - ../../evaluation/support-program-evidence:/evaluation-data:ro
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    # No host port, DB credentials, model key, upload, delete, or directory listing.

  ops-service:
    environment: &artifact-client
      LLMOPS_ARTIFACT_URL: http://ops-artifacts:8010
      LLMOPS_ARTIFACT_TOKEN: ${LLMOPS_ARTIFACT_TOKEN:?Generate .env.artifacts with init_ops_env.py --artifacts}
      LLMOPS_LIVE_ENABLED: "false"
    volumes: !reset []
    depends_on:
      ops-artifacts: {condition: service_started}

  ops-sync:
    environment: *artifact-client
    volumes: !reset []
    depends_on:
      ops-artifacts: {condition: service_started}

  evaluation-runner:
    environment:
      LLMOPS_LIVE_ENABLED: "false"
      OPENAI_API_KEY: ""
