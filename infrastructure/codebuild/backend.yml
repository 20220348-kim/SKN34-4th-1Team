version: 0.2

env:
  shell: bash
  # The AWS project overrides this only after its connection and SSM checks pass.
  variables:
    GOVBIZ_DEPLOY_ENABLED: "false"
    OPENAI_API_KEY: "compose-verification-key-never-sent"

phases:
  install:
    runtime-versions:
      java: corretto21
      python: 3.11
    commands:
      - python -m pip install uv==0.12.5
  build:
    on-failure: ABORT
    commands:
      # One fail-fast process: a failed test must never reach ECR or SSM.
      - bash infrastructure/codebuild/verify-backend.sh
      - python3 infrastructure/codebuild/release.py
