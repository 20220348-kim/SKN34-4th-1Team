# Default root Compose catalog boundary. Also usable after infrastructure/compose.yaml.
# Catalog owns its database and source/index writes; Core keeps its local read projection.
services:
  catalog-mysql:
    image: mysql:8.4
    init: true
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${CATALOG_MYSQL_DATABASE:-govbiz_catalog}
      MYSQL_USER: ${CATALOG_MYSQL_USER:-govbiz_catalog}
      MYSQL_PASSWORD: ${CATALOG_MYSQL_PASSWORD:-govbiz-catalog-local}
      MYSQL_ROOT_PASSWORD: ${CATALOG_MYSQL_ROOT_PASSWORD:-govbiz-catalog-root-local}
    volumes:
      - catalog-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=\"$${MYSQL_USER}\" --password=\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  catalog-service:
    build:
      context: ../backend/catalog-service
      dockerfile: Dockerfile
    init: true
    depends_on:
      catalog-mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      CATALOG_INTERNAL_TOKEN: ${CATALOG_INTERNAL_TOKEN:?Set a catalog server token of at least 32 characters}
      SPRING_DATASOURCE_URL: jdbc:mysql://catalog-mysql:3306/${CATALOG_MYSQL_DATABASE:-govbiz_catalog}
      SPRING_DATASOURCE_USERNAME: ${CATALOG_MYSQL_USER:-govbiz_catalog}
      SPRING_DATASOURCE_PASSWORD: ${CATALOG_MYSQL_PASSWORD:-govbiz-catalog-local}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_SERVICE_CONNECT_TIMEOUT: ${AI_SERVICE_CONNECT_TIMEOUT:-2s}
      AI_SEMANTIC_SEARCH_READ_TIMEOUT: ${AI_SEMANTIC_SEARCH_READ_TIMEOUT:-30s}
      ELASTICSEARCH_BASE_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX_NAME: ${ELASTICSEARCH_INDEX_NAME:-govbiz-support-program-lexical-v2}
      ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_API_KEY:-}
      ELASTICSEARCH_CONNECT_TIMEOUT: ${ELASTICSEARCH_CONNECT_TIMEOUT:-2s}
      ELASTICSEARCH_READ_TIMEOUT: ${ELASTICSEARCH_READ_TIMEOUT:-10s}
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      BIZINFO_API_BASE_URL: ${BIZINFO_API_BASE_URL:-https://apis.data.go.kr}
      BIZINFO_API_CONNECT_TIMEOUT: ${BIZINFO_API_CONNECT_TIMEOUT:-2s}
      BIZINFO_API_READ_TIMEOUT: ${BIZINFO_API_READ_TIMEOUT:-10s}
      BIZINFO_SYNC_ENABLED: ${BIZINFO_SYNC_ENABLED:-false}
      BIZINFO_SYNC_INITIAL_DELAY: ${BIZINFO_SYNC_INITIAL_DELAY:-PT0S}
      BIZINFO_SYNC_FIXED_DELAY: ${BIZINFO_SYNC_FIXED_DELAY:-PT6H}
      KSTARTUP_API_KEY: ${KSTARTUP_API_KEY:-}
      KSTARTUP_API_BASE_URL: ${KSTARTUP_API_BASE_URL:-https://apis.data.go.kr}
      KSTARTUP_API_CONNECT_TIMEOUT: ${KSTARTUP_API_CONNECT_TIMEOUT:-2s}
      KSTARTUP_API_READ_TIMEOUT: ${KSTARTUP_API_READ_TIMEOUT:-10s}
      KSTARTUP_SYNC_SCOPE: ${KSTARTUP_SYNC_SCOPE:-RECENT_YEAR}
      KSTARTUP_SYNC_ENABLED: ${KSTARTUP_SYNC_ENABLED:-false}
      KSTARTUP_SYNC_INITIAL_DELAY: ${KSTARTUP_SYNC_INITIAL_DELAY:-PT0S}
      KSTARTUP_SYNC_FIXED_DELAY: ${KSTARTUP_SYNC_FIXED_DELAY:-PT6H}
      MSIT_API_KEY: ${MSIT_API_KEY:-${DATA_GO_KR_SERVICE_KEY:-}}
      MSIT_API_BASE_URL: ${MSIT_API_BASE_URL:-https://apis.data.go.kr}
      MSIT_API_CONNECT_TIMEOUT: ${MSIT_API_CONNECT_TIMEOUT:-2s}
      MSIT_API_READ_TIMEOUT: ${MSIT_API_READ_TIMEOUT:-20s}
      MSIT_SYNC_ENABLED: ${MSIT_SYNC_ENABLED:-false}
      MSIT_SYNC_INITIAL_DELAY: ${MSIT_SYNC_INITIAL_DELAY:-PT0S}
      MSIT_SYNC_FIXED_DELAY: ${MSIT_SYNC_FIXED_DELAY:-PT6H}
      CNTRADE_NOTICE_API_KEY: ${CNTRADE_NOTICE_API_KEY:-${DATA_GO_KR_SERVICE_KEY:-}}
      CNTRADE_NOTICE_API_BASE_URL: ${CNTRADE_NOTICE_API_BASE_URL:-https://apis.data.go.kr}
      CNTRADE_NOTICE_API_CONNECT_TIMEOUT: ${CNTRADE_NOTICE_API_CONNECT_TIMEOUT:-2s}
      CNTRADE_NOTICE_API_READ_TIMEOUT: ${CNTRADE_NOTICE_API_READ_TIMEOUT:-20s}
      CNTRADE_NOTICE_SYNC_ENABLED: ${CNTRADE_NOTICE_SYNC_ENABLED:-false}
      CNTRADE_NOTICE_SYNC_INITIAL_DELAY: ${CNTRADE_NOTICE_SYNC_INITIAL_DELAY:-PT0S}
      CNTRADE_NOTICE_SYNC_FIXED_DELAY: ${CNTRADE_NOTICE_SYNC_FIXED_DELAY:-PT6H}
      SUPPORT_PROGRAM_INDEX_ENABLED: ${SUPPORT_PROGRAM_INDEX_ENABLED:-false}
      SUPPORT_PROGRAM_INDEX_INITIAL_DELAY: ${SUPPORT_PROGRAM_INDEX_INITIAL_DELAY:-PT0S}
      SUPPORT_PROGRAM_INDEX_FIXED_DELAY: ${SUPPORT_PROGRAM_INDEX_FIXED_DELAY:-PT1M}
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8081/readiness > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  core-service:
    environment:
      CATALOG_SERVICE_URL: http://catalog-service:8081
      CATALOG_INTERNAL_TOKEN: ${CATALOG_INTERNAL_TOKEN:?Set a catalog server token of at least 32 characters}
      CATALOG_PROJECTION_ENABLED: "true"
      CATALOG_SOURCES: ${CATALOG_SOURCES:-BIZINFO,KSTARTUP,MSIT,CNTRADE_NOTICE}
      CATALOG_CONNECT_TIMEOUT: ${CATALOG_CONNECT_TIMEOUT:-PT2S}
      CATALOG_READ_TIMEOUT: ${CATALOG_READ_TIMEOUT:-PT30S}
      CATALOG_PROJECTION_INITIAL_DELAY: ${CATALOG_PROJECTION_INITIAL_DELAY:-PT0S}
      CATALOG_PROJECTION_FIXED_DELAY: ${CATALOG_PROJECTION_FIXED_DELAY:-PT10S}
      BIZINFO_SYNC_ENABLED: "false"
      KSTARTUP_SYNC_ENABLED: "false"
      MSIT_SYNC_ENABLED: "false"
      CNTRADE_NOTICE_SYNC_ENABLED: "false"
      SUPPORT_PROGRAM_INDEX_ENABLED: "false"
      DATA_GO_KR_SERVICE_KEY: ""
      KSTARTUP_API_KEY: ""
      MSIT_API_KEY: ""
      CNTRADE_NOTICE_API_KEY: ""

volumes:
  catalog-mysql-data:
