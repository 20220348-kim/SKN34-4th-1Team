name: govbiz

services:
  elasticsearch:
    build:
      context: ./elasticsearch
    init: true
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      action.auto_create_index: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    # 개발망 내부 전용. 보안이 꺼진 HTTP 포트는 호스트/인터넷에 공개하지 않는다.
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s' > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-govbiz}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-govbiz-rabbit-local}
      RABBITMQ_DEFAULT_VHOST: govbiz
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    # 개발망 내부 전용. AMQP와 관리 UI 포트를 호스트에 공개하지 않는다.
    healthcheck:
      # 초기 probe가 root 소유 .erlang.cookie를 만들어 서버 기동과 충돌하지 않게 한다.
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  redis:
    image: redis:8.2.9-alpine
    init: true
    # 복원 상태는 조기 퇴거하지 않는다. 가득 차면 저장 요청을 명시적으로 실패시킨다.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    # 로컬 개발망 내부 전용. 호스트/인터넷에 Redis 포트를 공개하지 않는다.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.17.1
    init: true
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  mysql:
    image: mysql:8.4
    init: true
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-govbiz}
      MYSQL_USER: ${MYSQL_USER:-govbiz}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-govbiz-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-govbiz-root-local}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=\"$${MYSQL_USER}\" --password=\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  ai-service:
    build:
      context: ../backend/ai-service
      dockerfile: Dockerfile
    init: true
    environment:
      DOCUMENT_INTERNAL_TOKEN: ${DOCUMENT_INTERNAL_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      APPLICATION_FORM_DISCOVERY_MODEL_TIMEOUT_SECONDS: ${APPLICATION_FORM_DISCOVERY_MODEL_TIMEOUT_SECONDS:-210}
      APPLICATION_FORM_DISCOVERY_RUN_TIMEOUT_SECONDS: ${APPLICATION_FORM_DISCOVERY_RUN_TIMEOUT_SECONDS:-240}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_RANKING_MODEL: ${OPENAI_RANKING_MODEL:-}
      OPENAI_RANKING_REASONING_EFFORT: ${OPENAI_RANKING_REASONING_EFFORT:-none}
      OPENAI_RANKING_SERVICE_TIER: ${OPENAI_RANKING_SERVICE_TIER:-default}
      OPENAI_ASSISTANT_MODEL: ${OPENAI_ASSISTANT_MODEL:-gpt-5-nano}
      OPENAI_ASSISTANT_REASONING_EFFORT: ${OPENAI_ASSISTANT_REASONING_EFFORT:-low}
      OPENAI_ASSISTANT_AGENT_MODEL: ${OPENAI_ASSISTANT_AGENT_MODEL:-gpt-5.6-luna}
      ASSISTANT_TOOLS_BASE_URL: http://core-service:8080
      ASSISTANT_TOOLS_TOKEN: ${ASSISTANT_TOOLS_TOKEN:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-15}
      QDRANT_URL: http://qdrant:6333
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-5}
      LLM_MODEL_TIMEOUT_SECONDS: ${LLM_MODEL_TIMEOUT_SECONDS:-25.0}
      LLM_RUN_TIMEOUT_SECONDS: ${LLM_RUN_TIMEOUT_SECONDS:-30.0}
      LLM_COMBINATION_REVIEW_MODEL_TIMEOUT_SECONDS: ${LLM_COMBINATION_REVIEW_MODEL_TIMEOUT_SECONDS:-60.0}
      LLM_COMBINATION_REVIEW_RUN_TIMEOUT_SECONDS: ${LLM_COMBINATION_REVIEW_RUN_TIMEOUT_SECONDS:-70.0}
      LLM_RANKING_MODEL_TIMEOUT_SECONDS: ${LLM_RANKING_MODEL_TIMEOUT_SECONDS:-45.0}
      LLM_RANKING_RUN_TIMEOUT_SECONDS: ${LLM_RANKING_RUN_TIMEOUT_SECONDS:-50.0}
    expose:
      - "8000"

  core-service:
    build:
      context: ../backend/core-service
      dockerfile: Dockerfile
    init: true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_BASE_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX_NAME: ${ELASTICSEARCH_INDEX_NAME:-govbiz-support-program-lexical-v2}
      ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_API_KEY:-}
      ELASTICSEARCH_CONNECT_TIMEOUT: ${ELASTICSEARCH_CONNECT_TIMEOUT:-2s}
      ELASTICSEARCH_READ_TIMEOUT: ${ELASTICSEARCH_READ_TIMEOUT:-10s}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-govbiz}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-govbiz-rabbit-local}
      RABBITMQ_VHOST: govbiz
      DAILY_REPORT_QUEUE_ENABLED: ${DAILY_REPORT_QUEUE_ENABLED:-true}
      DAILY_REPORT_DELIVERY_QUEUE_ENABLED: ${DAILY_REPORT_DELIVERY_QUEUE_ENABLED:-true}
      ACCOUNT_OAUTH_UNLINK_ENABLED: ${ACCOUNT_OAUTH_UNLINK_ENABLED:-true}
      ACCOUNT_OAUTH_UNLINK_QUEUE_ENABLED: ${ACCOUNT_OAUTH_UNLINK_QUEUE_ENABLED:-true}
      COMBINATION_REVIEW_QUEUE_ENABLED: ${COMBINATION_REVIEW_QUEUE_ENABLED:-true}
      APPLICATION_FORM_ANALYSIS_ENABLED: ${APPLICATION_FORM_ANALYSIS_ENABLED:-false}
      APPLICATION_FORM_DISCOVERY_READ_TIMEOUT: ${APPLICATION_FORM_DISCOVERY_READ_TIMEOUT:-270s}
      APPLICATION_FORM_WORKER_LEASE: ${APPLICATION_FORM_WORKER_LEASE:-1800s}
      APPLICATION_FORM_DISCOVERY_QUEUE_ENABLED: ${APPLICATION_FORM_DISCOVERY_QUEUE_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-1s}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-1s}
      DOCUMENT_INTERNAL_TOKEN: ${DOCUMENT_INTERNAL_TOKEN:-}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_SERVICE_READ_TIMEOUT: ${AI_SERVICE_READ_TIMEOUT:-35s}
      AI_COMBINATION_REVIEW_READ_TIMEOUT: ${AI_COMBINATION_REVIEW_READ_TIMEOUT:-75s}
      AI_RANKING_READ_TIMEOUT: ${AI_RANKING_READ_TIMEOUT:-55s}
      SUPPORT_PROGRAM_REQUEST_PER_CLIENT_PER_MINUTE: ${SUPPORT_PROGRAM_REQUEST_PER_CLIENT_PER_MINUTE:-6}
      SUPPORT_PROGRAM_REQUEST_GLOBAL_PER_MINUTE: ${SUPPORT_PROGRAM_REQUEST_GLOBAL_PER_MINUTE:-60}
      SUPPORT_PROGRAM_REQUEST_MAX_CONCURRENT: ${SUPPORT_PROGRAM_REQUEST_MAX_CONCURRENT:-4}
      AI_SEMANTIC_SEARCH_READ_TIMEOUT: ${AI_SEMANTIC_SEARCH_READ_TIMEOUT:-30s}
      SUPPORT_PROGRAM_INDEX_ENABLED: ${SUPPORT_PROGRAM_INDEX_ENABLED:-true}
      SUPPORT_PROGRAM_INDEX_INITIAL_DELAY: ${SUPPORT_PROGRAM_INDEX_INITIAL_DELAY:-PT0S}
      SUPPORT_PROGRAM_INDEX_FIXED_DELAY: ${SUPPORT_PROGRAM_INDEX_FIXED_DELAY:-PT1M}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://127.0.0.1:5173}
      ASSISTANT_AGENT_ENABLED: ${ASSISTANT_AGENT_ENABLED:-false}
      ASSISTANT_TOOLS_TOKEN: ${ASSISTANT_TOOLS_TOKEN:-}
      ASSISTANT_PREFETCH_QUEUE_ENABLED: ${ASSISTANT_PREFETCH_QUEUE_ENABLED:-true}
      BIZINFO_API_BASE_URL: ${BIZINFO_API_BASE_URL:-https://apis.data.go.kr}
      BIZINFO_API_CONNECT_TIMEOUT: ${BIZINFO_API_CONNECT_TIMEOUT:-2s}
      BIZINFO_API_READ_TIMEOUT: ${BIZINFO_API_READ_TIMEOUT:-10s}
      BIZINFO_SYNC_ENABLED: ${BIZINFO_SYNC_ENABLED:-true}
      BIZINFO_SYNC_INITIAL_DELAY: ${BIZINFO_SYNC_INITIAL_DELAY:-PT0S}
      BIZINFO_SYNC_FIXED_DELAY: ${BIZINFO_SYNC_FIXED_DELAY:-PT6H}
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      KSTARTUP_API_KEY: ${KSTARTUP_API_KEY:-}
      KSTARTUP_API_BASE_URL: ${KSTARTUP_API_BASE_URL:-https://apis.data.go.kr}
      KSTARTUP_API_CONNECT_TIMEOUT: ${KSTARTUP_API_CONNECT_TIMEOUT:-2s}
      KSTARTUP_API_READ_TIMEOUT: ${KSTARTUP_API_READ_TIMEOUT:-10s}
      KSTARTUP_SYNC_SCOPE: ${KSTARTUP_SYNC_SCOPE:-RECENT_YEAR}
      KSTARTUP_SYNC_ENABLED: ${KSTARTUP_SYNC_ENABLED:-false}
      KSTARTUP_SYNC_INITIAL_DELAY: ${KSTARTUP_SYNC_INITIAL_DELAY:-PT0S}
      KSTARTUP_SYNC_FIXED_DELAY: ${KSTARTUP_SYNC_FIXED_DELAY:-PT6H}
      MSIT_API_KEY: ${MSIT_API_KEY:-${DATA_GO_KR_SERVICE_KEY:-}}
      MSIT_API_BASE_URL: ${MSIT_API_BASE_URL:-https://apis.data.go.kr}
      MSIT_API_CONNECT_TIMEOUT: ${MSIT_API_CONNECT_TIMEOUT:-2s}
      MSIT_API_READ_TIMEOUT: ${MSIT_API_READ_TIMEOUT:-20s}
      MSIT_SYNC_ENABLED: ${MSIT_SYNC_ENABLED:-false}
      MSIT_SYNC_INITIAL_DELAY: ${MSIT_SYNC_INITIAL_DELAY:-PT0S}
      MSIT_SYNC_FIXED_DELAY: ${MSIT_SYNC_FIXED_DELAY:-PT6H}
      CNTRADE_NOTICE_API_KEY: ${CNTRADE_NOTICE_API_KEY:-${DATA_GO_KR_SERVICE_KEY:-}}
      CNTRADE_NOTICE_API_BASE_URL: ${CNTRADE_NOTICE_API_BASE_URL:-https://apis.data.go.kr}
      CNTRADE_NOTICE_API_CONNECT_TIMEOUT: ${CNTRADE_NOTICE_API_CONNECT_TIMEOUT:-2s}
      CNTRADE_NOTICE_API_READ_TIMEOUT: ${CNTRADE_NOTICE_API_READ_TIMEOUT:-20s}
      CNTRADE_NOTICE_SYNC_ENABLED: ${CNTRADE_NOTICE_SYNC_ENABLED:-false}
      CNTRADE_NOTICE_SYNC_INITIAL_DELAY: ${CNTRADE_NOTICE_SYNC_INITIAL_DELAY:-PT0S}
      CNTRADE_NOTICE_SYNC_FIXED_DELAY: ${CNTRADE_NOTICE_SYNC_FIXED_DELAY:-PT6H}
      ACCOUNT_SESSION_TTL: ${ACCOUNT_SESSION_TTL:-P30D}
      ACCOUNT_SESSION_SHORT_TTL: ${ACCOUNT_SESSION_SHORT_TTL:-PT12H}
      ACCOUNT_SESSION_IDLE_TTL: ${ACCOUNT_SESSION_IDLE_TTL:-P7D}
      ACCOUNT_JWT_SECRET: ${ACCOUNT_JWT_SECRET:-govbiz-local-jwt-secret-change-in-production}
      ACCOUNT_COOKIE_SECURE: ${ACCOUNT_COOKIE_SECURE:-false}
      ACCOUNT_DEV_LOGIN_ENABLED: ${ACCOUNT_DEV_LOGIN_ENABLED:-true}
      ACCOUNT_DEV_LOGIN_EMAIL: ${ACCOUNT_DEV_LOGIN_EMAIL:-admin@govbiz.local}
      ACCOUNT_DEV_LOGIN_MEMBER_EMAIL: ${ACCOUNT_DEV_LOGIN_MEMBER_EMAIL:-member@govbiz.local}
      ACCOUNT_DEV_LOGIN_PASSWORD: ${ACCOUNT_DEV_LOGIN_PASSWORD:-govbiz-admin1}
      ACCOUNT_PASSWORD_RESET_MAIL_ENABLED: ${ACCOUNT_PASSWORD_RESET_MAIL_ENABLED:-false}
      ACCOUNT_PASSWORD_RESET_FROM: ${ACCOUNT_PASSWORD_RESET_FROM:-}
      ACCOUNT_PASSWORD_RESET_FRONTEND_BASE_URL: ${ACCOUNT_PASSWORD_RESET_FRONTEND_BASE_URL:-http://127.0.0.1:5173}
      # 회원가입 인증번호 메일의 발송 여부·발신 주소는 위 비밀번호 재설정 값을 그대로 물려받는다. 유효 시간만 따로 정한다.
      ACCOUNT_EMAIL_VERIFICATION_CODE_TTL: ${ACCOUNT_EMAIL_VERIFICATION_CODE_TTL:-PT10M}
      ACCOUNT_OAUTH_CALLBACK_BASE_URL: ${ACCOUNT_OAUTH_CALLBACK_BASE_URL:-http://127.0.0.1:5173}
      ACCOUNT_OAUTH_FRONTEND_BASE_URL: ${ACCOUNT_OAUTH_FRONTEND_BASE_URL:-http://127.0.0.1:5173}
      ACCOUNT_MOBILE_OAUTH_REDIRECT_URIS: ${ACCOUNT_MOBILE_OAUTH_REDIRECT_URIS:-}
      ACCOUNT_OAUTH_CONNECT_TIMEOUT: ${ACCOUNT_OAUTH_CONNECT_TIMEOUT:-2s}
      ACCOUNT_OAUTH_READ_TIMEOUT: ${ACCOUNT_OAUTH_READ_TIMEOUT:-10s}
      ACCOUNT_OAUTH_GOOGLE_CLIENT_ID: ${ACCOUNT_OAUTH_GOOGLE_CLIENT_ID:-}
      ACCOUNT_OAUTH_GOOGLE_CLIENT_SECRET: ${ACCOUNT_OAUTH_GOOGLE_CLIENT_SECRET:-}
      ACCOUNT_OAUTH_KAKAO_CLIENT_ID: ${ACCOUNT_OAUTH_KAKAO_CLIENT_ID:-}
      ACCOUNT_OAUTH_KAKAO_CLIENT_SECRET: ${ACCOUNT_OAUTH_KAKAO_CLIENT_SECRET:-}
      ACCOUNT_OAUTH_KAKAO_ADMIN_KEY: ${ACCOUNT_OAUTH_KAKAO_ADMIN_KEY:-}
      BIZNO_URL: ${BIZNO_URL:-https://bizno.net/api/fapi}
      BIZNO_API_KEY: ${BIZNO_API_KEY:-}
      DAILY_REPORT_ENABLED: ${DAILY_REPORT_ENABLED:-false}
      DAILY_REPORT_MAIL_ENABLED: ${DAILY_REPORT_MAIL_ENABLED:-false}
      DAILY_REPORT_FRONTEND_BASE_URL: ${DAILY_REPORT_FRONTEND_BASE_URL:-http://127.0.0.1:5173}
      DAILY_REPORT_FROM: ${DAILY_REPORT_FROM:-}
      DAILY_REPORT_SEND_HOUR: ${DAILY_REPORT_SEND_HOUR:-8}
      DAILY_REPORT_MAX_ACCOUNTS_PER_RUN: ${DAILY_REPORT_MAX_ACCOUNTS_PER_RUN:-20}
      DAILY_REPORT_MAX_REPORTS_PER_DAY: ${DAILY_REPORT_MAX_REPORTS_PER_DAY:-20}
      DAILY_REPORT_MAX_PROGRAMS: ${DAILY_REPORT_MAX_PROGRAMS:-3}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS_ENABLED: ${SMTP_STARTTLS_ENABLED:-true}
      SMTP_SSL_ENABLED: ${SMTP_SSL_ENABLED:-false}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-govbiz}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-govbiz}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-govbiz-local}
    ports:
      - "127.0.0.1:${CORE_API_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/api/v1/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  # 데모 데이터 적재. core-service가 healthy(마이그레이션 완료)된 뒤 공용 seed는 최초 1회, 개인 seed는 매번 누락분만 실행합니다.
  # DEMO_SEED_ENABLED=false면 바로 종료하고, DEMO_SEED_FORCE=true면 공용 자료와 선택 계정의 고정 키 개인 목업을 다시 넣습니다.
  demo-seed:
    image: mysql:8.4
    init: true
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
      core-service:
        condition: service_healthy
    environment:
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-true}
      DEMO_SEED_FORCE: ${DEMO_SEED_FORCE:-false}
      DEMO_SEED_TARGET_EMAILS: "${DEMO_SEED_TARGET_EMAILS:-}"
      DEMO_SEED_WAIT_SECONDS: ${DEMO_SEED_WAIT_SECONDS:-600}
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-govbiz}
      MYSQL_USER: ${MYSQL_USER:-govbiz}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-govbiz-local}
    volumes:
      - ./seed:/seed:ro
      - ./scripts/seed-demo-data-entrypoint.sh:/seed-entrypoint.sh:ro
    entrypoint: ["sh", "/seed-entrypoint.sh"]

  web:
    build:
      context: ..
      dockerfile: frontend/web/Dockerfile.dev
    init: true
    depends_on:
      core-service:
        condition: service_healthy
    working_dir: /app/frontend/web
    environment:
      CHOKIDAR_USEPOLLING: "true"
      # 바인드 마운트(Windows/macOS)는 파일 stat이 느려 폴링 간격을 너무 줄이면 Vite 프록시까지 느려진다. 기본 1000ms.
      CHOKIDAR_INTERVAL: ${CHOKIDAR_INTERVAL:-1000}
      # pnpm 저장소를 바인드 마운트 밖에 두어 감시·stat 대상에서 뺀다. 컨테이너 안 pnpm install이 /app/.pnpm-store를 만들지 않는다.
      # (pnpm 10+는 npm_config_* 대신 pnpm_config_* 환경변수를 읽는다.)
      pnpm_config_store_dir: /home/node/.pnpm-store
      # TTY 없이도 lockfile 변경 뒤 node_modules 정리를 묻지 않고 진행한다.
      CI: "true"
      VITE_CORE_API_BASE_URL: /
      VITE_DEV_PROXY_TARGET: http://core-service:8080
      VITE_KAKAO_CHANNEL_ID: ${KAKAO_CHANNEL_ID:-}
      VITE_ASSISTANT_AI_ENABLED: ${ASSISTANT_AI_ENABLED:-false}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5173}:5173"
    volumes:
      - ../package.json:/app/package.json
      - ../pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ../pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ../frontend/web:/app/frontend/web
      - ../frontend/packages/shared:/app/frontend/packages/shared
      - ../frontend/mobile/package.json:/app/frontend/mobile/package.json:ro
      - web-workspace-node-modules:/app/node_modules
      - web-frontend-node-modules:/app/frontend/web/node_modules
      - web-shared-node-modules:/app/frontend/packages/shared/node_modules

  bizinfo-stub:
    profiles:
      - verification
    build:
      context: ./stubs/bizinfo
      dockerfile: Dockerfile
    init: true
    expose:
      - "8001"

  openai-stub:
    profiles:
      - verification
    build:
      context: ./stubs/openai
      dockerfile: Dockerfile
    init: true
    expose:
      - "8002"

  kstartup-stub:
    profiles:
      - verification
    build:
      context: ./stubs/kstartup
      dockerfile: Dockerfile
    init: true
    expose:
      - "8003"

  public-notices-stub:
    profiles:
      - verification
    build:
      context: ./stubs/public-notices
      dockerfile: Dockerfile
    init: true
    expose:
      - "8004"

volumes:
  elasticsearch-data:
  rabbitmq-data:
  redis-data:
  mysql-data:
  qdrant-data:
  web-workspace-node-modules:
  web-frontend-node-modules:
  web-shared-node-modules:
