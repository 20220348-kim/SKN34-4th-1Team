# 개발 compose.yaml과 합치지 않는 독립 파일. AWS 자원을 생성하지 않는다.
name: govbiz-prod

x-runtime: &runtime
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  nginx:
    <<: *runtime
    image: ${NGINX_IMAGE:?Set a pinned Nginx image}
    mem_limit: 128m
    environment:
      GOVBIZ_PROXY_SECRET: ${GOVBIZ_PROXY_SECRET:?Set the Vercel shared proxy secret}
      # Nginx 자체 $변수는 치환하지 않는다.
      NGINX_ENVSUBST_FILTER: ^GOVBIZ_PROXY_SECRET$$
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/15-validate-secret.sh:/docker-entrypoint.d/15-validate-secret.sh:ro
    ports:
      # EC2 사설 IPv4를 명시한다. 0.0.0.0이나 공인 IP를 사용하지 않는다.
      - "${EC2_PRIVATE_IP:?Set the EC2 private IPv4}:80:8080"
    networks:
      proxy:
        ipv4_address: 172.30.254.2
    depends_on:
      core-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3

  core-service:
    <<: *runtime
    image: ${CORE_API_IMAGE:?Set a release image built from backend/core-service}
    mem_limit: 2g
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60.0
      SERVER_FORWARD_HEADERS_STRATEGY: native
      # 기본 사설망 전체 신뢰를 쓰지 않고 이 Compose의 Nginx 한 주소만 신뢰한다.
      SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES: '172\.30\.254\.2'
      SERVER_TOMCAT_REMOTEIP_REMOTE_IP_HEADER: X-Forwarded-For
      SERVER_TOMCAT_REMOTEIP_PROTOCOL_HEADER: X-Forwarded-Proto
      SERVER_TOMCAT_REDIRECT_CONTEXT_ROOT: "false"
      APP_CORS_ALLOWED_ORIGIN: ${GOVBIZ_FRONTEND_ORIGIN:?Set the canonical Vercel HTTPS origin}
      SPRING_DATASOURCE_URL: "jdbc:mysql://${RDS_HOST:?Set the RDS endpoint}:3306/${MYSQL_DATABASE:-govbiz}?sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:/run/secrets/rds-truststore.p12&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=changeit"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?Set the RDS application user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set the RDS application password}
      ACCOUNT_JWT_SECRET: ${ACCOUNT_JWT_SECRET:?Set a separate random JWT secret}
      ACCOUNT_COOKIE_SECURE: "true"
      ACCOUNT_DEV_LOGIN_ENABLED: "false"
      ACCOUNT_OAUTH_CALLBACK_BASE_URL: ${GOVBIZ_FRONTEND_ORIGIN}
      ACCOUNT_OAUTH_FRONTEND_BASE_URL: ${GOVBIZ_FRONTEND_ORIGIN}
      ACCOUNT_MOBILE_OAUTH_REDIRECT_URIS: ${ACCOUNT_MOBILE_OAUTH_REDIRECT_URIS:-}
      ACCOUNT_PASSWORD_RESET_FRONTEND_BASE_URL: ${GOVBIZ_FRONTEND_ORIGIN}
      # SMTP 자격증명은 EC2 환경 파일에만 두며, 가입/재설정 메일을 명시적으로 켠다.
      ACCOUNT_EMAIL_VERIFICATION_MAIL_ENABLED: ${ACCOUNT_EMAIL_VERIFICATION_MAIL_ENABLED:-false}
      ACCOUNT_EMAIL_VERIFICATION_FROM: ${ACCOUNT_EMAIL_VERIFICATION_FROM:-}
      ACCOUNT_PASSWORD_RESET_MAIL_ENABLED: ${ACCOUNT_PASSWORD_RESET_MAIL_ENABLED:-false}
      ACCOUNT_PASSWORD_RESET_FROM: ${ACCOUNT_PASSWORD_RESET_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS_ENABLED: ${SMTP_STARTTLS_ENABLED:-true}
      SMTP_SSL_ENABLED: ${SMTP_SSL_ENABLED:-false}
      DAILY_REPORT_FRONTEND_BASE_URL: ${GOVBIZ_FRONTEND_ORIGIN}
      ACCOUNT_OAUTH_GOOGLE_CLIENT_ID: ${ACCOUNT_OAUTH_GOOGLE_CLIENT_ID:-}
      ACCOUNT_OAUTH_GOOGLE_CLIENT_SECRET: ${ACCOUNT_OAUTH_GOOGLE_CLIENT_SECRET:-}
      ACCOUNT_OAUTH_KAKAO_CLIENT_ID: ${ACCOUNT_OAUTH_KAKAO_CLIENT_ID:-}
      ACCOUNT_OAUTH_KAKAO_CLIENT_SECRET: ${ACCOUNT_OAUTH_KAKAO_CLIENT_SECRET:-}
      ACCOUNT_OAUTH_KAKAO_ADMIN_KEY: ${ACCOUNT_OAUTH_KAKAO_ADMIN_KEY:-}
      ACCOUNT_OAUTH_UNLINK_ENABLED: ${ACCOUNT_OAUTH_UNLINK_ENABLED:-false}
      ACCOUNT_OAUTH_UNLINK_QUEUE_ENABLED: ${ACCOUNT_OAUTH_UNLINK_QUEUE_ENABLED:-false}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a Redis password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: govbiz
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set a RabbitMQ password}
      RABBITMQ_VHOST: govbiz
      DAILY_REPORT_QUEUE_ENABLED: ${DAILY_REPORT_QUEUE_ENABLED:-false}
      DAILY_REPORT_DELIVERY_QUEUE_ENABLED: ${DAILY_REPORT_DELIVERY_QUEUE_ENABLED:-false}
      COMBINATION_REVIEW_QUEUE_ENABLED: ${COMBINATION_REVIEW_QUEUE_ENABLED:-false}
      APPLICATION_FORM_ANALYSIS_ENABLED: ${APPLICATION_FORM_ANALYSIS_ENABLED:-false}
      APPLICATION_FORM_DISCOVERY_READ_TIMEOUT: ${APPLICATION_FORM_DISCOVERY_READ_TIMEOUT:-270s}
      APPLICATION_FORM_WORKER_LEASE: ${APPLICATION_FORM_WORKER_LEASE:-1800s}
      APPLICATION_FORM_DISCOVERY_QUEUE_ENABLED: ${APPLICATION_FORM_DISCOVERY_QUEUE_ENABLED:-false}
      ELASTICSEARCH_BASE_URL: http://elasticsearch:9200
      AI_SERVICE_BASE_URL: http://ai-service:8000
      DOCUMENT_INTERNAL_TOKEN: ${DOCUMENT_INTERNAL_TOKEN:-}
      # Vercel의 공개 AI 스위치와 별개다. 토큰은 두 서버 컨테이너에만 전달한다.
      ASSISTANT_AGENT_ENABLED: ${ASSISTANT_AGENT_ENABLED:-false}
      ASSISTANT_TOOLS_TOKEN: ${ASSISTANT_TOOLS_TOKEN:-}
      AI_SERVICE_READ_TIMEOUT: 35s
      AI_RANKING_READ_TIMEOUT: 55s
      AI_SEMANTIC_SEARCH_READ_TIMEOUT: 30s
      AI_COMBINATION_REVIEW_READ_TIMEOUT: 75s
      SUPPORT_PROGRAM_REQUEST_PER_CLIENT_PER_MINUTE: "6"
      SUPPORT_PROGRAM_REQUEST_GLOBAL_PER_MINUTE: "60"
      SUPPORT_PROGRAM_REQUEST_MAX_CONCURRENT: "4"
      # 첫 기동에서는 외부 수집·유료 임베딩·메일을 실행하지 않는다.
      BIZINFO_SYNC_ENABLED: ${BIZINFO_SYNC_ENABLED:-false}
      KSTARTUP_SYNC_ENABLED: ${KSTARTUP_SYNC_ENABLED:-false}
      MSIT_SYNC_ENABLED: ${MSIT_SYNC_ENABLED:-false}
      CNTRADE_NOTICE_SYNC_ENABLED: ${CNTRADE_NOTICE_SYNC_ENABLED:-false}
      SUPPORT_PROGRAM_INDEX_ENABLED: ${SUPPORT_PROGRAM_INDEX_ENABLED:-false}
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      KSTARTUP_API_KEY: ${KSTARTUP_API_KEY:-}
      MSIT_API_KEY: ${MSIT_API_KEY:-${DATA_GO_KR_SERVICE_KEY:-}}
      CNTRADE_NOTICE_API_KEY: ${CNTRADE_NOTICE_API_KEY:-${DATA_GO_KR_SERVICE_KEY:-}}
      BIZNO_API_KEY: ${BIZNO_API_KEY:-}
      DAILY_REPORT_ENABLED: "false"
      DAILY_REPORT_MAIL_ENABLED: "false"
    volumes:
      - ${RDS_TRUSTSTORE_PATH:?Set an absolute PKCS12 RDS CA truststore path}:/run/secrets/rds-truststore.p12:ro
    networks: [proxy, backend]
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/api/v1/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 12
      start_period: 60s

  ai-service:
    <<: *runtime
    image: ${AI_SERVICE_IMAGE:?Set a release image built from backend/ai-service}
    mem_limit: 1g
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set the existing OpenAI API key on EC2 only}
      OPENAI_BASE_URL: https://api.openai.com/v1
      ASSISTANT_TOOLS_BASE_URL: http://core-service:8080
      DOCUMENT_INTERNAL_TOKEN: ${DOCUMENT_INTERNAL_TOKEN:-}
      ASSISTANT_TOOLS_TOKEN: ${ASSISTANT_TOOLS_TOKEN:-}
      APPLICATION_FORM_DISCOVERY_MODEL_TIMEOUT_SECONDS: ${APPLICATION_FORM_DISCOVERY_MODEL_TIMEOUT_SECONDS:-210}
      APPLICATION_FORM_DISCOVERY_RUN_TIMEOUT_SECONDS: ${APPLICATION_FORM_DISCOVERY_RUN_TIMEOUT_SECONDS:-240}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_RANKING_MODEL: ${OPENAI_RANKING_MODEL:-}
      OPENAI_RANKING_REASONING_EFFORT: none
      OPENAI_RANKING_SERVICE_TIER: default
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      OPENAI_EMBEDDING_DIMENSIONS: "1536"
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set a Qdrant API key}
    networks: [backend]
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/internal/v1/health', timeout=2).close()"]
      interval: 15s
      timeout: 3s
      retries: 12
      start_period: 30s

  elasticsearch:
    <<: *runtime
    # 반드시 infrastructure/elasticsearch/Dockerfile의 Nori 설치 이미지를 사용한다.
    image: ${ELASTICSEARCH_IMAGE:?Set the release Nori image}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      action.auto_create_index: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 2g
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    volumes: [elasticsearch-data:/usr/share/elasticsearch/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s' > /dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 30
      start_period: 30s

  qdrant:
    <<: *runtime
    image: qdrant/qdrant:v1.17.1
    mem_limit: 1g
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes: [qdrant-data:/qdrant/storage]
    networks: [backend]

  redis:
    <<: *runtime
    image: redis:8.2.9-alpine
    mem_limit: 256m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-ec", 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync everysec --maxmemory 128mb --maxmemory-policy noeviction']
    volumes: [redis-data:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 15s
      timeout: 3s
      retries: 12

  rabbitmq:
    <<: *runtime
    image: rabbitmq:4.3.5-management-alpine
    hostname: rabbitmq
    mem_limit: 512m
    environment:
      RABBITMQ_DEFAULT_USER: govbiz
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: govbiz
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    networks: [backend]
    healthcheck:
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 5s
      retries: 24
      start_period: 20s

networks:
  # CIDR를 바꾸면 Nginx IP와 Core의 신뢰 IP 정규식도 함께 변경·검증한다.
  proxy:
    ipam:
      config: [{ subnet: 172.30.254.0/28 }]
  backend: {}

# govbiz 개발 프로젝트와 분리된 named volume. Docker data-root는 EBS에 두고 별도 백업한다.
volumes:
  elasticsearch-data:
  qdrant-data:
  redis-data:
  rabbitmq-data:
