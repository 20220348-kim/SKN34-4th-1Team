AWSTemplateFormatVersion: '2010-09-09'
Description: HTTPS API entrypoint for an existing internal Sydney EKS ALB (no web hosting).
Parameters:
  AlbArn:
    Type: String
    AllowedPattern: 'arn:aws:elasticloadbalancing:ap-southeast-2:[0-9]{12}:loadbalancer/app/[a-zA-Z0-9-]+/[a-f0-9]+'
    Description: ARN of the active internal ALB created by the api-gateway Ingress.
  AlbDnsName:
    Type: String
    AllowedPattern: 'internal-[a-zA-Z0-9-]+\.ap-southeast-2\.elb\.amazonaws\.com'
    Description: DNS name of that same ALB (no scheme or path).
Resources:
  ApiVpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub '${AWS::StackName}-api'
        Arn: !Ref AlbArn
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only
        OriginSSLProtocols: [TLSv1.2]
  ApiDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: GovBiz API only; Vercel owns the web site
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
        Origins:
          - Id: api
            DomainName: !Ref AlbDnsName
            # Do not repeat model/generation requests when the origin is unavailable.
            ConnectionAttempts: 1
            ConnectionTimeout: 3
            VpcOriginConfig:
              VpcOriginId: !GetAtt ApiVpcOrigin.Id
              OriginReadTimeout: 120
              OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: api
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: false
          # Managed CachingDisabled: min/default/max TTL are all zero.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # Forward authorization, cookies, Origin, CSRF and all query parameters.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        # Default error caching must not cache another user's permission result.
        CustomErrorResponses:
          - {ErrorCode: 400, ErrorCachingMinTTL: 0}
          - {ErrorCode: 403, ErrorCachingMinTTL: 0}
          - {ErrorCode: 404, ErrorCachingMinTTL: 0}
          - {ErrorCode: 405, ErrorCachingMinTTL: 0}
          - {ErrorCode: 414, ErrorCachingMinTTL: 0}
          - {ErrorCode: 416, ErrorCachingMinTTL: 0}
          - {ErrorCode: 500, ErrorCachingMinTTL: 0}
          - {ErrorCode: 501, ErrorCachingMinTTL: 0}
          - {ErrorCode: 502, ErrorCachingMinTTL: 0}
          - {ErrorCode: 503, ErrorCachingMinTTL: 0}
          - {ErrorCode: 504, ErrorCachingMinTTL: 0}
Outputs:
  ApiOrigin:
    Value: !Sub 'https://${ApiDistribution.DomainName}'
    Description: Set GOVBIZ_API_ORIGIN in Vercel Production after origin checks pass.
  DistributionId:
    Value: !Ref ApiDistribution
