AWSTemplateFormatVersion: '2010-09-09'
Description: HTTPS API and restricted Argo CD entrypoint for an existing internal Sydney EKS ALB.
Parameters:
  AlbArn:
    Type: String
    AllowedPattern: 'arn:aws:elasticloadbalancing:ap-southeast-2:[0-9]{12}:loadbalancer/app/[a-zA-Z0-9-]+/[a-f0-9]+'
    Description: ARN of the active internal ALB created by the api-gateway Ingress.
  AlbDnsName:
    Type: String
    AllowedPattern: 'internal-[a-zA-Z0-9-]+\.ap-southeast-2\.elb\.amazonaws\.com'
    Description: DNS name of that same ALB (no scheme or path).
  ArgoAllowedIpv4:
    Type: String
    Default: ''
    AllowedPattern: '^$|^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$'
    Description: One administrator IPv4 address, without CIDR. Empty disables Argo access.
  ArgoOriginSecret:
    Type: String
    Default: ''
    NoEcho: true
    AllowedPattern: '^$|^[a-f0-9]{64}$'
    Description: Separate 64-character Argo origin secret; never use the Vercel API proxy secret. Empty disables the origin header.
Conditions:
  HasArgoOriginSecret: !Not [!Equals [!Ref ArgoOriginSecret, '']]
Resources:
  ArgoViewerAccess:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-argo-access'
      AutoPublish: true
      FunctionConfig:
        Comment: Replace untrusted Argo access headers using the actual viewer IP.
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          // Never trust a viewer-supplied marker, including on normalized paths.
          delete request.headers['x-govbiz-argo-access'];
          delete request.headers['x-govbiz-argo-host'];
          var allowedIp = '${ArgoAllowedIpv4}';
          if (allowedIp !== '' && event.viewer.ip === allowedIp) {
            request.headers['x-govbiz-argo-access'] = {value: 'allowed'};
            request.headers['x-govbiz-argo-host'] = {value: request.headers.host.value};
          }
          return request;
        }
  ApiVpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub '${AWS::StackName}-api'
        Arn: !Ref AlbArn
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only
        OriginSSLProtocols: [TLSv1.2]
  ApiDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: GovBiz API only; Vercel owns the web site
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
        Origins:
          - Id: api
            DomainName: !Ref AlbDnsName
            # This authenticates this distribution only. The gateway also requires
            # the IP-derived marker for Argo and keeps its separate API guard.
            OriginCustomHeaders: !If
              - HasArgoOriginSecret
              - - HeaderName: x-govbiz-argo-origin
                  HeaderValue: !Ref ArgoOriginSecret
              - !Ref AWS::NoValue
            # Do not repeat model/generation requests when the origin is unavailable.
            ConnectionAttempts: 1
            ConnectionTimeout: 3
            VpcOriginConfig:
              VpcOriginId: !GetAtt ApiVpcOrigin.Id
              OriginReadTimeout: 120
              OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: api
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: false
          # Managed CachingDisabled: min/default/max TTL are all zero.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # Forward authorization, cookies, Origin, CSRF and all query parameters.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ArgoViewerAccess.FunctionARN
        # Default error caching must not cache another user's permission result.
        CustomErrorResponses:
          - {ErrorCode: 400, ErrorCachingMinTTL: 0}
          - {ErrorCode: 403, ErrorCachingMinTTL: 0}
          - {ErrorCode: 404, ErrorCachingMinTTL: 0}
          - {ErrorCode: 405, ErrorCachingMinTTL: 0}
          - {ErrorCode: 414, ErrorCachingMinTTL: 0}
          - {ErrorCode: 416, ErrorCachingMinTTL: 0}
          - {ErrorCode: 500, ErrorCachingMinTTL: 0}
          - {ErrorCode: 501, ErrorCachingMinTTL: 0}
          - {ErrorCode: 502, ErrorCachingMinTTL: 0}
          - {ErrorCode: 503, ErrorCachingMinTTL: 0}
          - {ErrorCode: 504, ErrorCachingMinTTL: 0}
Outputs:
  ApiOrigin:
    Value: !Sub 'https://${ApiDistribution.DomainName}'
    Description: Set GOVBIZ_API_ORIGIN in Vercel Production after origin checks pass.
  DistributionId:
    Value: !Ref ApiDistribution
