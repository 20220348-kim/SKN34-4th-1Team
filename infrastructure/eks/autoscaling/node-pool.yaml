AWSTemplateFormatVersion: '2010-09-09'
Description: Cluster Autoscaler identity for the existing GovBiz application node group
Parameters:
  ClusterName:
    Type: String
    Default: govbiz-eks
    AllowedValues: [govbiz-eks]
Resources:
  AutoscalerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: pods.eks.amazonaws.com}
            Action: [sts:AssumeRole, sts:TagSession]
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
                aws:RequestTag/kubernetes-namespace: kube-system
                aws:RequestTag/kubernetes-service-account: cluster-autoscaler
      Policies:
        - PolicyName: discover-and-scale-govbiz-pool
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [autoscaling:SetDesiredCapacity, autoscaling:TerminateInstanceInAutoScalingGroup]
                Resource: '*'
                Condition:
                  StringEquals:
                    autoscaling:ResourceTag/k8s.io/cluster-autoscaler/enabled: 'true'
                    autoscaling:ResourceTag/k8s.io/cluster-autoscaler/govbiz-eks: owned
                    autoscaling:ResourceTag/govbiz.io/workload-pool: application
              - Effect: Allow
                Action:
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:DescribeAutoScalingInstances
                  - autoscaling:DescribeLaunchConfigurations
                  - autoscaling:DescribeScalingActivities
                  - autoscaling:DescribeTags
                  - ec2:DescribeImages
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeLaunchTemplateVersions
                  - ec2:GetInstanceTypesFromInstanceRequirements
                Resource: '*'
              - Effect: Allow
                Action: eks:DescribeNodegroup
                Resource: !Sub arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:nodegroup/${ClusterName}/application/*
      Tags: [{Key: project, Value: govbiz}]
  AutoscalerIdentity:
    Type: AWS::EKS::PodIdentityAssociation
    Properties:
      ClusterName: !Ref ClusterName
      Namespace: kube-system
      ServiceAccount: cluster-autoscaler
      RoleArn: !GetAtt AutoscalerRole.Arn
Outputs:
  AutoscalerRoleArn:
    Value: !GetAtt AutoscalerRole.Arn
