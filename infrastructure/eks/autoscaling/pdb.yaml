# Protect single writers and data stores, and retain one ready Core/AI replica
# during Cluster Autoscaler eviction without editing Pod templates.
# These budgets do not make single replicas highly available and do not stop
# Deployment updates, explicit Pod deletion, or involuntary node failure.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: core-service-available
  namespace: govbiz-msa
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: core-service
      app.kubernetes.io/name: core-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-service-available
  namespace: govbiz-msa
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: ai-service
      app.kubernetes.io/name: ai-service
---
