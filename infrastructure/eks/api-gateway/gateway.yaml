apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  # HorizontalPodAutoscaler owns replicas.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app.kubernetes.io/name: api-gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api-gateway}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {govbiz.io/http-pool: shared}
      terminationGracePeriodSeconds: 620
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: api-gateway}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          image: nginx@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
          command: [/bin/sh, /etc/govbiz/start.sh]
          lifecycle:
            preStop:
              exec:
                # Allow endpoint removal to propagate, then gracefully drain Nginx.
                command: [/bin/sh, -c, 'sleep 10; nginx -c /tmp/nginx.conf -s quit; while kill -0 1 2>/dev/null; do sleep 1; done']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - name: GOVBIZ_PROXY_SECRET
              valueFrom:
                secretKeyRef: {name: api-gateway-secret, key: GOVBIZ_PROXY_SECRET}
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          volumeMounts:
            - {name: config, mountPath: /etc/govbiz, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: api-gateway-config}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: api-gateway}
  ports: [{name: http, port: 8080, targetPort: http}]
