apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: api-gateway}
  policyTypes: [Ingress, Egress]
  ingress:
    # ALB connections/health checks originate in the Sydney demo VPC.
    # ALB's security group independently restricts CloudFront ingress.
    - from: [{ipBlock: {cidr: 10.80.0.0/16}}]
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: core-service}
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: ops-service}
      ports: [{protocol: TCP, port: 8000}]
