# Explicit EKS runtime infrastructure; the application release does not own this policy.
# Adds public IPv4 HTTPS for manual live evaluation without changing internal peer rules.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: evaluation-runner-openai-egress
  namespace: govbiz-evaluation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: evaluation-runner
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            # Standard NetworkPolicy cannot restrict an HTTPS destination by hostname.
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
          port: 443
