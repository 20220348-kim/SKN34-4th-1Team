# Public desired configuration. Runtime environment/Secret references are adopted privately.
services:
  core-service:
    autoscaling: {enabled: true, minReplicas: 1, maxReplicas: 3, targetCPUUtilizationPercentage: 60}
    resources:
      requests: {cpu: 100m, memory: 512Mi}
    env:
      ACCOUNT_OAUTH_FRONTEND_BASE_URL: https://govbiz.vercel.app
      DAILY_REPORT_FRONTEND_BASE_URL: https://govbiz.vercel.app
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 270s
  catalog-service: {}
  ai-service:
    autoscaling: {enabled: true, minReplicas: 1, maxReplicas: 3, targetCPUUtilizationPercentage: 60}
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {cpu: "2", memory: 1Gi}
  ops-service:
    env:
      DJANGO_COOKIE_SECURE: "true"
      OPS_WEB_URL: https://govbiz.vercel.app
      DJANGO_CSRF_TRUSTED_ORIGINS: https://govbiz.vercel.app
evaluation:
  evaluation-runner:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
  ops-artifacts:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
# HTTP replicas can use either existing role; data/single-writer workloads retain their pool.
httpNodeSelector: {govbiz.io/http-pool: shared}
placement:
  core-service: application
  catalog-service: application
  ai-service: observability
  ops-service: application
  evaluation-runner: application
  ops-artifacts: application
resultsClaim: results-cutover
