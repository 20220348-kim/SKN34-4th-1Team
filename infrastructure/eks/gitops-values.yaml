# Public desired configuration. Runtime environment/Secret references are adopted privately.
services:
  core-service:
    env:
      ACCOUNT_OAUTH_FRONTEND_BASE_URL: https://govbiz.vercel.app
      DAILY_REPORT_FRONTEND_BASE_URL: https://govbiz.vercel.app
  catalog-service: {}
  ai-service:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "2", memory: 1Gi}
  ops-service:
    env:
      DJANGO_COOKIE_SECURE: "true"
      OPS_WEB_URL: https://govbiz.vercel.app
      DJANGO_CSRF_TRUSTED_ORIGINS: https://govbiz.vercel.app
evaluation:
  evaluation-runner:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
  ops-artifacts:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
placement:
  core-service: application
  catalog-service: application
  ai-service: observability
  ops-service: application
  evaluation-runner: application
  ops-artifacts: application
resultsClaim: results-cutover
