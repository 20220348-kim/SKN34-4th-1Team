AWSTemplateFormatVersion: '2010-09-09'
Description: Administrator-only HTTPS Langfuse entrypoint through the existing EKS API VPC origin.
Parameters:
  VpcOriginId:
    Type: String
    MinLength: 1
    Description: Existing API CloudFront VPC origin ID; this stack does not create another ALB or VPC origin.
  AlbDnsName:
    Type: String
    AllowedPattern: 'internal-[a-zA-Z0-9-]+\.ap-southeast-2\.elb\.amazonaws\.com'
    Description: DNS name of the internal ALB attached to that same VPC origin.
  LangfuseAllowedIpv4:
    Type: String
    Default: ''
    AllowedPattern: '^$|^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$'
    Description: One administrator IPv4 address, without CIDR. Empty denies all Langfuse access.
  LangfuseOriginSecret:
    Type: String
    NoEcho: true
    AllowedPattern: '^[a-f0-9]{64}$'
    Description: Independent 64-character Langfuse origin secret, matching the gateway Secret. Never reuse API or Argo credentials.
Resources:
  LangfuseViewerAccess:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-langfuse-access'
      AutoPublish: true
      FunctionConfig:
        Comment: Deny every Langfuse path except for the configured administrator IPv4.
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          delete request.headers['x-govbiz-langfuse-access'];
          delete request.headers['x-govbiz-langfuse-host'];
          delete request.headers['x-govbiz-langfuse-origin'];
          var allowedIp = '${LangfuseAllowedIpv4}';
          if (allowedIp === '' || event.viewer.ip !== allowedIp) {
            return {
              statusCode: 403,
              statusDescription: 'Forbidden',
              headers: {'cache-control': {value: 'no-store'}}
            };
          }
          request.headers['x-govbiz-langfuse-access'] = {value: 'allowed'};
          request.headers['x-govbiz-langfuse-host'] = {value: request.headers.host.value};
          return request;
        }
  LangfuseDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: GovBiz Langfuse administrator UI; uses the existing internal EKS ALB
        Enabled: true
        HttpVersion: http2and3
        # The access rule is explicitly IPv4-only; do not prefer an unlisted IPv6 address.
        IPV6Enabled: false
        PriceClass: PriceClass_All
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
        Origins:
          - Id: langfuse
            DomainName: !Ref AlbDnsName
            # Langfuse keeps its root URLs; only the private gateway sees this prefix.
            OriginPath: /_langfuse
            OriginCustomHeaders:
              - HeaderName: x-govbiz-langfuse-origin
                HeaderValue: !Ref LangfuseOriginSecret
            ConnectionAttempts: 1
            ConnectionTimeout: 3
            VpcOriginConfig:
              VpcOriginId: !Ref VpcOriginId
              OriginReadTimeout: 120
              OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: langfuse
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: false
          # Managed CachingDisabled: min/default/max TTL are all zero.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # AllViewerExceptHostHeader forwards auth, cookies, Origin, CSRF and query strings.
          # The viewer function supplies the trusted public host separately.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt LangfuseViewerAccess.FunctionARN
        CustomErrorResponses:
          - {ErrorCode: 400, ErrorCachingMinTTL: 0}
          - {ErrorCode: 403, ErrorCachingMinTTL: 0}
          - {ErrorCode: 404, ErrorCachingMinTTL: 0}
          - {ErrorCode: 405, ErrorCachingMinTTL: 0}
          - {ErrorCode: 414, ErrorCachingMinTTL: 0}
          - {ErrorCode: 416, ErrorCachingMinTTL: 0}
          - {ErrorCode: 500, ErrorCachingMinTTL: 0}
          - {ErrorCode: 501, ErrorCachingMinTTL: 0}
          - {ErrorCode: 502, ErrorCachingMinTTL: 0}
          - {ErrorCode: 503, ErrorCachingMinTTL: 0}
          - {ErrorCode: 504, ErrorCachingMinTTL: 0}
Outputs:
  LangfuseOrigin:
    Value: !Sub 'https://${LangfuseDistribution.DomainName}'
    Description: Set Langfuse NEXTAUTH_URL to this HTTPS root and Ops LANGFUSE_PROJECT_URL to its project base URL (without /traces).
  DistributionId:
    Value: !Ref LangfuseDistribution
