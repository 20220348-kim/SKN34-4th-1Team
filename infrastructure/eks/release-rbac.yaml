apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: govbiz-eks-release, namespace: govbiz-msa}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [core-service, catalog-service, ai-service, ops-service]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: govbiz-eks-release, namespace: govbiz-msa}
subjects: [{kind: Group, name: govbiz-eks-release, apiGroup: rbac.authorization.k8s.io}]
roleRef: {kind: Role, name: govbiz-eks-release, apiGroup: rbac.authorization.k8s.io}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: govbiz-eks-release, namespace: govbiz-evaluation}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [evaluation-runner, ops-artifacts]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: govbiz-eks-release, namespace: govbiz-evaluation}
subjects: [{kind: Group, name: govbiz-eks-release, apiGroup: rbac.authorization.k8s.io}]
roleRef: {kind: Role, name: govbiz-eks-release, apiGroup: rbac.authorization.k8s.io}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: govbiz-eks-release, namespace: argocd}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [govbiz-eks]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: govbiz-eks-release, namespace: argocd}
subjects: [{kind: Group, name: govbiz-eks-release, apiGroup: rbac.authorization.k8s.io}]
roleRef: {kind: Role, name: govbiz-eks-release, apiGroup: rbac.authorization.k8s.io}
