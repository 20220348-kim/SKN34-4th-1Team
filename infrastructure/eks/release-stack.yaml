AWSTemplateFormatVersion: '2010-09-09'
Description: GovBiz ECR publication and VPC-local CodeBuild deployment (no cluster or database creation)
Parameters:
  ClusterName:
    Type: String
    AllowedPattern: '[A-Za-z0-9][A-Za-z0-9_-]{0,99}'
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  ClusterSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  GitHubOidcProviderArn:
    Type: String
    AllowedPattern: 'arn:aws:iam::[0-9]{12}:oidc-provider/token.actions.githubusercontent.com'
Resources:
  CoreImage:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: govbiz-demo/core-service
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
  CatalogImage:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: govbiz-demo/catalog-service
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
  AiImage:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: govbiz-demo/ai-service
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
  OpsImage:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: govbiz-demo/ops-service
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
  RunnerImage:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: govbiz-demo/evaluation-runner
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
  ReleaseBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration: {Status: Enabled}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: release-inputs
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration: {NoncurrentDays: 30}
  ReleaseBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReleaseBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt ReleaseBucket.Arn, !Sub '${ReleaseBucket.Arn}/*']
            Condition: {Bool: {aws:SecureTransport: 'false'}}
  DeployLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/codebuild/${AWS::StackName}-deploy'
      RetentionInDays: 7
  DeploySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CodeBuild outbound access through existing private-subnet NAT
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  ClusterApiIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ClusterSecurityGroupId
      SourceSecurityGroupId: !Ref DeploySecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref 'AWS::AccountId'}
              ArnEquals: {aws:SourceArn: !Sub 'arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/${AWS::StackName}-deploy'}
      Policies:
        - PolicyName: private-cluster-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt DeployLogs.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub '${ReleaseBucket.Arn}/releases/*'
              - Effect: Allow
                Action: [s3:GetBucketLocation, s3:GetBucketAcl]
                Resource: !GetAtt ReleaseBucket.Arn
              - Effect: Allow
                Action: eks:DescribeCluster
                Resource: !Sub 'arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}'
              - Effect: Allow
                Action: [ec2:CreateNetworkInterface, ec2:DeleteNetworkInterface, ec2:DescribeNetworkInterfaces,
                         ec2:DescribeVpcs, ec2:DescribeSubnets, ec2:DescribeSecurityGroups, ec2:DescribeDhcpOptions]
                Resource: '*'
              - Effect: Allow
                Action: ec2:CreateNetworkInterfacePermission
                Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*'
                Condition: {StringEquals: {ec2:AuthorizedService: codebuild.amazonaws.com}}
  DeployAccess:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref ClusterName
      PrincipalArn: !GetAtt DeployRole.Arn
      Type: STANDARD
      KubernetesGroups: [govbiz-eks-release]
  DeployProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-deploy'
      ServiceRole: !GetAtt DeployRole.Arn
      ConcurrentBuildLimit: 1
      TimeoutInMinutes: 35
      QueuedTimeoutInMinutes: 10
      Artifacts: {Type: NO_ARTIFACTS}
      Source:
        Type: S3
        Location: !Sub '${ReleaseBucket}/releases/bootstrap.zip'
        BuildSpec: |
          version: 0.2
          phases:
            install:
              commands:
                - curl -fsSLo /tmp/kubectl https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl
                - curl -fsSLo /tmp/kubectl.sha256 https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl.sha256
                - cd /tmp && echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check && chmod +x kubectl
                - export PATH="/tmp:$PATH"
            build:
              commands:
                - cd "$CODEBUILD_SRC_DIR"
                - python3 -B infrastructure/eks/deploy.py
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: false
        EnvironmentVariables:
          - {Name: AWS_ACCOUNT_ID, Value: !Ref 'AWS::AccountId'}
          - {Name: EKS_CLUSTER_NAME, Value: !Ref ClusterName}
          - {Name: KUBECONFIG, Value: /tmp/govbiz-eks-kubeconfig}
      VpcConfig:
        VpcId: !Ref VpcId
        Subnets: !Ref PrivateSubnetIds
        SecurityGroupIds: [!Ref DeploySecurityGroup]
      LogsConfig:
        CloudWatchLogs: {Status: ENABLED, GroupName: !Ref DeployLogs}
  GitHubReleaseRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubOidcProviderArn}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:ilil1/SKN34-4th-1Team:environment:eks-production
      Policies:
        - PolicyName: publish-and-dispatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:DescribeRepositories, ecr:BatchGetImage, ecr:BatchCheckLayerAvailability,
                         ecr:GetDownloadUrlForLayer, ecr:InitiateLayerUpload, ecr:UploadLayerPart,
                         ecr:CompleteLayerUpload, ecr:PutImage]
                Resource: [!GetAtt CoreImage.Arn, !GetAtt CatalogImage.Arn, !GetAtt AiImage.Arn,
                           !GetAtt OpsImage.Arn, !GetAtt RunnerImage.Arn]
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${ReleaseBucket.Arn}/releases/*'
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource: !GetAtt DeployProject.Arn
Outputs:
  ReleaseRoleArn: {Value: !GetAtt GitHubReleaseRole.Arn}
  ReleaseBucketName: {Value: !Ref ReleaseBucket}
  DeployProjectName: {Value: !Ref DeployProject}
  DeployRoleArn: {Value: !GetAtt DeployRole.Arn}
