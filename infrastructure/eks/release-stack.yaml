AWSTemplateFormatVersion: '2010-09-09'
Description: GovBiz CodeConnections and ephemeral CodeBuild Actions runner for private EKS deployment
Parameters:
  ClusterName:
    Type: String
    AllowedPattern: '[A-Za-z0-9][A-Za-z0-9_-]{0,99}'
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  ClusterSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  GitHubConnectionArn:
    Type: String
    AllowedPattern: 'arn:aws:codeconnections:ap-southeast-2:[0-9]{12}:connection/[a-f0-9-]+'
  GitHubActorId:
    Type: String
    AllowedPattern: '[0-9]+'
    Description: Numeric GitHub ID of the trusted release operator (not a login name)
  EnableWebhook:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
Conditions:
  WebhookEnabled: !Equals [!Ref EnableWebhook, 'true']
Resources:
  CoreImage:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: govbiz-demo/core-service
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
  CatalogImage:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: govbiz-demo/catalog-service
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
  AiImage:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: govbiz-demo/ai-service
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
  OpsImage:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: govbiz-demo/ops-service
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
  RunnerImage:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: govbiz-demo/evaluation-runner
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
  DeployLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/codebuild/${AWS::StackName}-deploy'
      RetentionInDays: 7
  DeploySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CodeBuild outbound access through existing private-subnet NAT
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        # Existing Debian-based Dockerfiles fetch signed packages over HTTP.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  ClusterApiIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ClusterSecurityGroupId
      SourceSecurityGroupId: !Ref DeploySecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref 'AWS::AccountId'}
              ArnEquals: {aws:SourceArn: !Sub 'arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/${AWS::StackName}-deploy'}
      Policies:
        - PolicyName: private-cluster-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt DeployLogs.Arn
              - Effect: Allow
                Action: [codeconnections:GetConnection, codeconnections:GetConnectionToken, codeconnections:UseConnection]
                Resource: !Ref GitHubConnectionArn
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:DescribeRepositories, ecr:BatchGetImage, ecr:BatchCheckLayerAvailability,
                         ecr:GetDownloadUrlForLayer, ecr:InitiateLayerUpload, ecr:UploadLayerPart,
                         ecr:CompleteLayerUpload, ecr:PutImage]
                Resource: [!GetAtt CoreImage.Arn, !GetAtt CatalogImage.Arn, !GetAtt AiImage.Arn,
                           !GetAtt OpsImage.Arn, !GetAtt RunnerImage.Arn]
              - Effect: Allow
                Action: eks:DescribeCluster
                Resource: !Sub 'arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}'
              - Effect: Allow
                Action: [ec2:CreateNetworkInterface, ec2:DeleteNetworkInterface, ec2:DescribeNetworkInterfaces,
                         ec2:DescribeVpcs, ec2:DescribeSubnets, ec2:DescribeSecurityGroups, ec2:DescribeDhcpOptions]
                Resource: '*'
              - Effect: Allow
                Action: ec2:CreateNetworkInterfacePermission
                Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*'
                Condition: {StringEquals: {ec2:AuthorizedService: codebuild.amazonaws.com}}
  DeployAccess:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref ClusterName
      PrincipalArn: !GetAtt DeployRole.Arn
      Type: STANDARD
      KubernetesGroups: [govbiz-eks-release]
  DeployProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-deploy'
      ServiceRole: !GetAtt DeployRole.Arn
      ConcurrentBuildLimit: 1
      TimeoutInMinutes: 120
      QueuedTimeoutInMinutes: 30
      Artifacts: {Type: NO_ARTIFACTS}
      SourceVersion: refs/heads/main
      Source:
        Type: GITHUB
        Location: https://github.com/ilil1/SKN34-4th-1Team.git
        Auth:
          Type: CODECONNECTIONS
          Resource: !Ref GitHubConnectionArn
        GitCloneDepth: 1
        # Standalone builds do not deploy. Runner jobs use the checked-in workflow.
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - echo 'Use the CI-gated EKS and Vercel release workflow'; exit 1
      Triggers:
        Webhook: !If [WebhookEnabled, true, false]
        FilterGroups: !If
          - WebhookEnabled
          - - - Type: EVENT
                Pattern: WORKFLOW_JOB_QUEUED
              - Type: WORKFLOW_NAME
                Pattern: '^EKS and Vercel release$'
              - Type: ACTOR_ACCOUNT_ID
                Pattern: !Sub '^${GitHubActorId}$'
          - !Ref AWS::NoValue
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - {Name: AWS_ACCOUNT_ID, Value: !Ref 'AWS::AccountId'}
          - {Name: EKS_CLUSTER_NAME, Value: !Ref ClusterName}
          - {Name: KUBECONFIG, Value: /tmp/govbiz-eks-kubeconfig}
      VpcConfig:
        VpcId: !Ref VpcId
        Subnets: !Ref PrivateSubnetIds
        SecurityGroupIds: [!Ref DeploySecurityGroup]
      LogsConfig:
        CloudWatchLogs: {Status: ENABLED, GroupName: !Ref DeployLogs}
Outputs:
  DeployProjectName: {Value: !Ref DeployProject}
  DeployRoleArn: {Value: !GetAtt DeployRole.Arn}
