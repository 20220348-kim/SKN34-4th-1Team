# Sydney seven-day demo. Still requires cost approval and the real administrator CIDR.
# Copy to infrastructure/gitops/.local/eks/cluster.yaml for the selected account.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: govbiz-eks
  region: ap-southeast-2
  # Set a version supported by EKS in the chosen region on deployment day.
  # Local kind's Kubernetes version is not an EKS availability guarantee.
  version: '1.36'
  tags:
    project: govbiz
    environment: first-deployment

# Two control-plane AZs; both single-node workload pools use one AZ. This is not HA.
availabilityZones: [ap-southeast-2a, ap-southeast-2c]
vpc:
  cidr: 10.80.0.0/16
  clusterEndpoints: {publicAccess: true, privateAccess: true}
  # Documentation address: replace with the administrator's current public IP/32.
  publicAccessCIDRs: [203.0.113.1/32]
  nat: {gateway: Single}

accessConfig:
  authenticationMode: API_AND_CONFIG_MAP
  bootstrapClusterCreatorAdminPermissions: true

addonsConfig:
  autoApplyPodIdentityAssociations: true
addons:
  - name: eks-pod-identity-agent
  - name: vpc-cni
    configurationValues: '{"enableNetworkPolicy":"true"}'
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver

managedNodeGroups:
  - name: application
    instanceType: m7i-flex.large
    amiFamily: AmazonLinux2023
    availabilityZones: [ap-southeast-2a]
    privateNetworking: true
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    volumeType: gp3
    volumeSize: 80
    volumeEncrypted: true
    disableIMDSv1: true
    disablePodIMDS: true
    # Preserve the existing Elasticsearch mmap requirement across node replacement.
    preBootstrapCommands:
      - |
        set -eu
        echo 'vm.max_map_count=1048576' > /etc/sysctl.d/99-govbiz-elasticsearch.conf
        sysctl -p /etc/sysctl.d/99-govbiz-elasticsearch.conf
    ssh: {allow: false}
    labels: {govbiz.io/workload-pool: application}
    tags: {project: govbiz, environment: first-deployment}

  - name: observability
    instanceType: m7i-flex.large
    amiFamily: AmazonLinux2023
    availabilityZones: [ap-southeast-2a]
    privateNetworking: true
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    volumeType: gp3
    volumeSize: 80
    volumeEncrypted: true
    disableIMDSv1: true
    disablePodIMDS: true
    # Preserve the existing Elasticsearch mmap requirement across node replacement.
    preBootstrapCommands:
      - |
        set -eu
        echo 'vm.max_map_count=1048576' > /etc/sysctl.d/99-govbiz-elasticsearch.conf
        sysctl -p /etc/sysctl.d/99-govbiz-elasticsearch.conf
    ssh: {allow: false}
    labels: {govbiz.io/workload-pool: observability}
    tags: {project: govbiz, environment: first-deployment}

cloudWatch:
  clusterLogging:
    enableTypes: [api, audit, authenticator]
    logRetentionInDays: 7
