name: ${COMPOSE_PROJECT_NAME:-govbiz-infra}

# 애플리케이션 모노레포의 로컬 통합 실행. 기존 개발 데이터 볼륨 이름을 보존합니다.
# 웹의 Node 의존성 캐시는 별도 workspace 레이아웃으로 초기화합니다.
include:
  - path:
      - ./infrastructure/compose.yaml
      - ./infrastructure/compose.catalog.yaml
    env_file: ${GOVBIZ_APP_ENV_FILE:-./.env}
  - path: ./compose.ops.yaml
    env_file: ${GOVBIZ_DJANGO_ENV_FILE:-./backend/ops-service/.env}
