# ops-service의 단독 Compose를 재사용하고 통합 환경의 환경 파일·볼륨을 분리합니다.
services:
  ops-service:
    extends:
      file: ./backend/ops-service/compose.yaml
      service: ops-service
    env_file: !override
      - ${GOVBIZ_DJANGO_ENV_FILE:-./backend/ops-service/.env}
    environment:
      DB_HOST: ops-mysql
      CORE_API_URL: http://core-service:8080
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},ops-service
      LLMOPS_RESULTS_DIR: /results
    volumes:
      - ops-results:/results:ro
    depends_on: !override
      ops-mysql:
        condition: service_healthy
      ops-bootstrap:
        condition: service_completed_successfully

  # 기본 프로젝트 실행에 포함한다. 빈 DB만 초기화하고 기존 검토·기준은 보존한다.
  ops-bootstrap:
    extends:
      service: ops-service
    command: ["python", "manage.py", "bootstrap_local_reviews"]
    environment:
      LLMOPS_LOCAL_SEED_ENABLED: "true"
    ports: !reset []
    healthcheck:
      test: ["NONE"]
    volumes:
      - ops-results:/results
    depends_on: !override
      ops-mysql:
        condition: service_healthy
    restart: "no"

  ops-mysql:
    extends:
      file: ./backend/ops-service/compose.yaml
      service: ops-mysql
    volumes:
      # 동일한 /var/lib/mysql 대상만 교체하여 원본 초기화 SQL 마운트는 유지합니다.
      - ops-mysql-data:/var/lib/mysql

volumes:
  ops-mysql-data:
  ops-results:
