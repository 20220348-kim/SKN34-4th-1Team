name: govbiz-ops

services:
  ops-service:
    build: .
    init: true
    # 로컬 소스 변경 자동 반영용. 이미지 자체는 Gunicorn으로 실행됩니다.
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    env_file: .env
    environment:
      DB_NAME: govbiz4
      DB_USER: govbiz4
      DB_HOST: ops-mysql
      DB_PORT: "3306"
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    volumes:
      - ./config:/app/config:ro
      - ./apps:/app/apps:ro
      - ./manage.py:/app/manage.py:ro
    depends_on:
      ops-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=8).close()"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  ops-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: govbiz4
      MYSQL_USER: govbiz4
      MYSQL_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infrastructure/mysql/01-development-test-database.sql:/docker-entrypoint-initdb.d/01-development-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u govbiz4 -D govbiz4 -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql-data:
