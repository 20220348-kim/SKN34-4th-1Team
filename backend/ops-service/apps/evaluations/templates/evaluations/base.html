<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}평가 관리{% endblock %} · GovBiz Ops</title>
  <style>
    :root{font-family:system-ui,-apple-system,sans-serif;color:#172536;background:#f3f6fa;font-size:15px;line-height:1.6}
    *{box-sizing:border-box}body{margin:0}header{background:#102b39;color:#fff;padding:18px 5%;display:flex;align-items:center;justify-content:space-between;gap:16px}header a{color:#fff;text-decoration:none}header strong{font-size:20px}header small{color:#b9d2d8;margin-left:14px}.account{display:flex;align-items:center;gap:20px}main{max-width:1120px;margin:40px auto;padding:0 24px}h1{font-size:30px;letter-spacing:-1px;margin:8px 0}h2{font-size:19px;margin:0 0 16px}a{color:#126574}p{margin:8px 0}.muted{color:#657586}.eyebrow{color:#126574;font-size:12px;font-weight:750;letter-spacing:2px}.card{background:#fff;border:1px solid #dce4ec;border-radius:12px;padding:24px;margin:24px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}button,.button{background:#126574;color:white;border:0;border-radius:7px;padding:10px 18px;font:inherit;font-weight:650;text-decoration:none;cursor:pointer;display:inline-block}button:hover,.button:hover{background:#0c4a56}.secondary{background:#e8f1f2;color:#125767}.quiet{background:transparent;color:inherit;padding:5px}label{font-weight:650;display:block;margin:12px 0 6px}input,select{font:inherit;padding:10px;border:1px solid #aebdca;border-radius:6px;width:100%;max-width:620px}.errorlist,.alert{color:#9a361a;background:#fff3eb;padding:12px 18px;border-radius:6px}.notice{color:#506270;border-left:3px solid #50a5ac;padding-left:14px;margin:20px 0}.table-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid #e5ebf0;white-space:nowrap}th{color:#607283;font-size:12px}.badge{display:inline-block;background:#edf1f6;border-radius:99px;padding:3px 12px;font-size:12px;font-weight:700}.COMPLETED{color:#18633e;background:#e4f5eb}.FAILED,.CRASHED,.RESULT_ERROR{color:#983419;background:#ffece6}.RUNNING,.QUEUED{color:#165e8b;background:#e8f3ff}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.metric{background:#f5f8fa;padding:18px;border-radius:8px}.metric strong{display:block;font-size:26px;margin-top:6px}.metric span{font-size:12px;color:#607283}dl{display:grid;grid-template-columns:150px 1fr;gap:12px}dt{color:#657586}dd{margin:0;overflow-wrap:anywhere}.links{display:flex;gap:12px;flex-wrap:wrap}.login{max-width:440px;margin:64px auto}.login button{width:100%;margin-top:24px}code{font-size:12px;overflow-wrap:anywhere}footer{margin:36px 0;color:#6a7c8c;font-size:12px}.empty{padding:40px;text-align:center;color:#657586}@media(max-width:700px){.metrics{grid-template-columns:repeat(2,1fr)}header small{display:none}main{padding:0 16px;margin:24px auto}.card{padding:18px}dl{grid-template-columns:1fr;gap:4px}dd{margin-bottom:12px}}
  </style>
</head>
<body>
<header><a href="{% url 'evaluation-list' %}"><strong>GovBiz Ops</strong><small>LLM 평가 운영</small></a>
{% if user.is_authenticated %}<div class="account"><span>{{ user.username }}</span><form method="post" action="{% url 'ops-logout' %}">{% csrf_token %}<button class="quiet">로그아웃</button></form></div>{% endif %}</header>
<main>{% block content %}{% endblock %}<footer>저장된 평가 자료 재계산 · 모델 API 호출 0회</footer></main>
{% block scripts %}{% endblock %}
</body></html>
