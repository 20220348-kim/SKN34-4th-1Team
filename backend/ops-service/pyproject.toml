[project]
name = "govbiz-ops-service"
version = "0.1.0"
description = "GovBiz 4차 프로젝트 Django 서비스"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2.17,<5.3",
    "django-environ>=0.12,<1",
    "djangorestframework>=3.16,<4",
    "gunicorn>=26.2,<27",
    "mysqlclient>=2.2.7,<3",
]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.uv]
package = false
required-version = "==0.12.5"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
