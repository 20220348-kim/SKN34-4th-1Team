plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.4.10'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ai.govbiz'
version = '0.0.1-SNAPSHOT'
description = 'GovBiz Catalog Service'
springBoot { mainClass = 'ai.govbiz.catalog.CatalogServiceApplicationKt' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
kotlin {
    jvmToolchain(21)
    compilerOptions { freeCompilerArgs.addAll('-Xjsr305=strict', '-Xjspecify-annotations=strict') }
}
repositories { mavenCentral() }
dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.0'
    implementation 'tools.jackson.module:jackson-module-kotlin'
    implementation 'org.jsoup:jsoup:1.23.2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') {
    useJUnitPlatform { excludeTags 'live-source' }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
