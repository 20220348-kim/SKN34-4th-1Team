[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govbiz-ai-service"
version = "0.1.0"
description = "Internal AI analysis service for GovBiz"
requires-python = ">=3.11,<3.15"
dependencies = [
    "mcp==2.1.0",
    "jsonschema>=4.23,<5",
    "fastapi>=0.139.2,<0.140.0",
    "httpx>=0.28,<1",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "openai>=3.1.0,<4.0.0",
    "openai-agents>=0.22.0,<0.23.0",
    "pydantic>=2.12.2,<3.0.0",
    "qdrant-client>=1.17.0,<1.18.0",
    "tiktoken>=0.12.0,<0.13.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0.0,<3.0.0",
    "pytest>=8.4.0,<10.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
