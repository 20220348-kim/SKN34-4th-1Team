plugins {
    id 'java'
    id 'idea'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.4.10'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = false
    }
}

group = 'ai.govbiz'
version = '0.0.1-SNAPSHOT'
description = 'GovBiz Core API'

springBoot { mainClass = 'ai.govbiz.core.CoreApiApplicationKt' }

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

kotlin {
    jvmToolchain(21)
    compilerOptions {
        freeCompilerArgs.addAll(
            '-Xjsr305=strict',
            '-Xjspecify-annotations=strict'
        )
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.0'
    implementation 'tools.jackson.module:jackson-module-kotlin'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    implementation 'kr.dogfoot:hwplib:1.1.11'
    implementation 'org.apache.tika:tika-core:4.0.0'
    implementation 'org.apache.tika:tika-parser-miscoffice-module:4.0.0'
    // 회원 비밀번호 BCrypt 해시 전용. Security filter chain·자동 설정은 사용하지 않는다.
    implementation 'org.springframework.security:spring-security-crypto'
    // 검색 경로만 명시적으로 계측해 기존 Langfuse OTLP 수신기로 전송한다.
    // Spring Boot BOM의 동일 버전으로 SDK와 exporter 내부 모듈을 맞춘다.
    implementation 'io.opentelemetry:opentelemetry-sdk'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'
}

tasks.named('test') {
    useJUnitPlatform {
        if (!project.hasProperty('includeLiveSources')) {
            excludeTags 'live-source'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 실제 Core 청커만 호출하는 무료 평가 준비. Spring/DB/HTTP/모델 실행은 없다.
tasks.register('preflightEvidenceEvaluation', JavaExec) {
    group = 'verification'
    description = 'Inspect an official RAG fixture with the production Core chunker.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ai.govbiz.core.supportprogram.service.evaluation.SupportProgramEvidenceEvaluationPreflight'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    doFirst {
        if (!project.hasProperty('evidenceFixture') || !project.hasProperty('evidenceReport')) {
            throw new GradleException('Specify -PevidenceFixture=<input.json> -PevidenceReport=<new-report.json>')
        }
        args project.file(project.property('evidenceFixture')).absolutePath,
             project.file(project.property('evidenceReport')).absolutePath
    }
}
