worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Do not record query strings, cookies, request bodies or authentication headers.
    log_format govbiz '$request_method $uri $status $request_time';
    access_log /dev/stdout govbiz;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server_tokens off;
    sendfile on;

    # Stable ClusterIP Services in the same namespace; never a workstation address.
    upstream core_api { server core-service:8080; }
    upstream ops_api { server ops-service:8000; }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        # Match the existing Core chat snapshot limit and document generation timeout.
        client_max_body_size 2m;
        client_header_timeout 10s;
        client_body_timeout 15s;

        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        proxy_http_version 1.1;
        # Preserve the external port and Origin together for Django CSRF validation.
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Govbiz-Proxy-Secret "";
        proxy_set_header X-Govbiz-Client-IP "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 100s;
        proxy_read_timeout 100s;
        proxy_next_upstream off;
        proxy_buffering off;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header CDN-Cache-Control;
        proxy_hide_header Vercel-CDN-Cache-Control;
        proxy_hide_header Expires;

        location = /healthz { access_log off; return 200 'ok'; }
        location = /api { return 404; }
        location = /api/v1/ops { proxy_pass http://ops_api; }
        location ^~ /api/v1/ops/ { proxy_pass http://ops_api; }
        location /api/ {
            proxy_pass http://core_api;
            location ~ ^/api/v1/application-preparations/[0-9]+/documents$ {
                proxy_pass http://core_api;
                proxy_read_timeout 600s;
            }
        }
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
