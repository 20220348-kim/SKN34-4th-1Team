<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1432" viewBox="0 0 1440 1432" role="img" aria-labelledby="title description">
<title id="title">GovBiz LLMOps 평가·운영 흐름</title>
<desc id="description">기존 Core 관리자 계정으로 React 운영 화면에 로그인한다. Django Ops가 권한, 실행 명세와 예산을 확인하고 Prefect 실행기에 작업을 전달한다. 저장 응답 재평가, 고정 근거 새 답변, 고정 원문·청크의 새 RAG 실행 중 하나를 선택한다. pandas와 Pandera로 데이터를 검증하고 Evidently 보고서와 Langfuse 관측·점수를 확인한다. 자료와 답변의 사람 검토, 품질 판정, 비교 기준 수동 지정을 거쳐 다음 평가에서 재사용한다. 실행·사용량·검토 기록은 Ops MySQL에, 답변 캡처와 보고서는 결과 저장소에 보존한다. 실제 모델 호출은 승인된 자료와 예산 범위에서만 실행하며, 평가 완료가 품질 합격을 뜻하지 않는다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#7A9B8C"/></marker></defs>
<style>text { font-family: NanumGothic, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }</style>
<rect width="1440" height="1432" rx="28" fill="#FCFEFC"/>

