<svg xmlns="http://www.w3.org/2000/svg" width="820" height="96" viewBox="0 0 820 96" role="img" aria-labelledby="title description">
  <title id="title">5.2.6 운영 배포 프로세스</title>
  <desc id="description">운영 배포는 GitHub Actions가 순서를 제어하고, CodeBuild가 이미지를 빌드해 ECR에 저장한 뒤, Argo CD가 Git의 배포 설정을 EKS에 반영하는 흐름입니다. 백엔드 배포가 성공하면 같은 커밋의 웹을 Vercel 운영 주소로 전환합니다.</desc>
  <style>
    text { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .accent { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .accent { fill: #4493f8; }
    }
  </style>
  <rect class="accent" x="0" y="4" width="4" height="84" rx="2" />
  <text x="20" y="20" font-size="15" font-weight="600">5.2.6 운영 배포 프로세스</text>
  <text x="20" y="42" font-size="13">운영 배포는 <tspan font-weight="600">GitHub Actions가 순서를 제어하고, CodeBuild가 이미지를 빌드해 ECR에 저장한 뒤,</tspan></text>
  <text x="20" y="62" font-size="13"><tspan font-weight="600">Argo CD가 Git의 배포 설정을 EKS에 반영</tspan>하는 흐름입니다.</text>
  <text x="20" y="82" font-size="13">백엔드 배포가 성공하면 같은 커밋의 웹을 Vercel 운영 주소로 전환합니다.</text>
</svg>
