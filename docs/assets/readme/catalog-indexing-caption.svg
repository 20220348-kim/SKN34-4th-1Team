<svg xmlns="http://www.w3.org/2000/svg" width="820" height="76" viewBox="0 0 820 76" role="img" aria-labelledby="title description">
  <title id="title">① 공고 수집 · ② 검색에 쓸 자료 저장</title>
  <desc id="description">Catalog가 수집한 공고를 메모리에 보관하고, Elasticsearch 검색 문서와 Qdrant 임베딩 벡터를 준비합니다.</desc>
  <style>
    text { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .accent { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .accent { fill: #4493f8; }
    }
  </style>
  <rect class="accent" x="0" y="4" width="4" height="64" rx="2" />
  <text x="20" y="20" font-size="15" font-weight="600">① 공고 수집 · ② 검색에 쓸 자료 저장</text>
  <text x="20" y="42" font-size="13">Catalog가 수집한 공고를 메모리에 보관하고,</text>
  <text x="20" y="62" font-size="13">Elasticsearch 검색 문서와 Qdrant 임베딩 벡터를 준비합니다.</text>
</svg>
