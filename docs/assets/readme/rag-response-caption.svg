<svg xmlns="http://www.w3.org/2000/svg" width="820" height="100" viewBox="0 0 820 100" role="img" aria-labelledby="title description">
  <title id="title">검증·답변·출처 표시</title>
  <desc id="description">검색된 청크의 ID·해시를 원문과 대조한 뒤 답변을 생성하고 인용을 확인합니다.</desc>
  <style>
    text { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .accent { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .accent { fill: #4493f8; }
    }
  </style>
  <rect class="accent" x="0" y="4" width="4" height="88" rx="2" />
  <text x="20" y="25" font-size="20" font-weight="600">검증·답변·출처 표시</text>
  <text x="20" y="56" font-size="18">검색된 청크의 ID·해시를 원문과 대조한 뒤</text>
  <text x="20" y="82" font-size="18">답변을 생성하고 인용을 확인합니다.</text>
</svg>
