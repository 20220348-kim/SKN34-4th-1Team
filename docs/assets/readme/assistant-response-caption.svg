<svg xmlns="http://www.w3.org/2000/svg" width="820" height="76" viewBox="0 0 820 76" role="img" aria-labelledby="title description">
  <title id="title">자료 조회·근거 검색·응답 검증</title>
  <desc id="description">도구 에이전트가 활성화된 회원 요청은 core-service의 읽기 전용 API로 자료를 조회합니다. 관심 공고 질문에는 허용된 공고의 근거만 검색합니다.</desc>
  <style>
    text { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .accent { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .accent { fill: #4493f8; }
    }
  </style>
  <rect class="accent" x="0" y="4" width="4" height="64" rx="2" />
  <text x="20" y="20" font-size="15" font-weight="600">자료 조회·근거 검색·응답 검증</text>
  <text x="20" y="42" font-size="13">도구 에이전트가 활성화된 회원 요청은 core-service의 읽기 전용 API로 자료를 조회합니다.</text>
  <text x="20" y="62" font-size="13">관심 공고 질문에는 허용된 공고의 근거만 검색합니다.</text>
</svg>
