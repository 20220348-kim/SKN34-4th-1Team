<svg xmlns="http://www.w3.org/2000/svg" width="820" height="76" viewBox="0 0 820 76" role="img" aria-labelledby="title description">
  <title id="title">실행 요청·권한·예산 확인</title>
  <desc id="description">관리자의 요청을 검증하고 HTTP 요청 밖의 평가 실행으로 연결합니다.</desc>
  <style>
    text { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .accent { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .accent { fill: #4493f8; }
    }
  </style>
  <rect class="accent" x="0" y="4" width="4" height="64" rx="2" />
  <text x="20" y="20" font-size="15" font-weight="600">실행 요청·권한·예산 확인</text>
  <text x="20" y="42" font-size="13">관리자의 요청을 검증하고</text>
  <text x="20" y="62" font-size="13">HTTP 요청 밖의 평가 실행으로 연결합니다.</text>
</svg>
