    }
  </style>
  <rect class="accent" x="0" y="4" width="4" height="76" rx="2" />
  <text x="20" y="23" font-size="18" font-weight="600">후보 결합·최종 응답</text>
  <text x="20" y="48" font-size="16">공고 ID·순위로 후보를 합친 뒤, 읽어 둔 공고 내용에</text>
