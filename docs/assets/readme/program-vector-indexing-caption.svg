  </style>
  <rect class="accent" x="0" y="4" width="4" height="64" rx="2" />
  <text x="20" y="20" font-size="15" font-weight="600">① AI 대화 검색 · 공고 단위</text>
  <text x="20" y="42" font-size="13">Catalog가 공고 검색 텍스트를 구성하고, AI Service가 OpenAI 임베딩으로</text>
  <text x="20" y="62" font-size="13">공고 검색 문서 1건당 벡터 1개를 저장합니다.</text>
