<svg xmlns="http://www.w3.org/2000/svg" width="820" height="96" viewBox="0 0 820 96" role="img" aria-labelledby="title description">
  <title id="title">5.2.2 Kubernetes 로컬 전체 구성도</title>
  <desc id="description">개발 PC의 kind 클러스터에 업무 서비스와 LLMOps를 함께 실행합니다. 업무(govbiz-msa)·평가(govbiz-evaluation)·관측(govbiz-observability) namespace로 구분하고, 서비스는 ClusterIP·내부 DNS로 통신하며 데이터는 PVC에 보존합니다.</desc>
  <style>
    text { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .accent { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .accent { fill: #4493f8; }
    }
  </style>
  <rect class="accent" x="0" y="4" width="4" height="84" rx="2" />
  <text x="20" y="20" font-size="15" font-weight="600">5.2.2 Kubernetes 로컬 전체 구성도</text>
  <text x="20" y="42" font-size="13">개발 PC의 kind 클러스터에 업무 서비스와 LLMOps를 함께 실행합니다.</text>
  <text x="20" y="62" font-size="13">업무(govbiz-msa)·평가(govbiz-evaluation)·관측(govbiz-observability) namespace로 구분하고,</text>
  <text x="20" y="82" font-size="13">서비스는 ClusterIP·내부 DNS로 통신하며 데이터는 PVC에 보존합니다.</text>
</svg>
