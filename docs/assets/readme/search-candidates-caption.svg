<svg xmlns="http://www.w3.org/2000/svg" width="820" height="76" viewBox="0 0 820 76" role="img" aria-labelledby="title description">
  <title id="title">검색 대상 준비·후보 검색</title>
  <desc id="description">번호는 사용자가 조건을 확정한 뒤 core-service가 조회·검색을 요청하는 순서입니다.</desc>
  <style>
    text { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .accent { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .accent { fill: #4493f8; }
    }
  </style>
  <rect class="accent" x="0" y="4" width="4" height="64" rx="2" />
  <text x="20" y="20" font-size="16" font-weight="600">검색 대상 준비·후보 검색</text>
  <text x="20" y="42" font-size="14">번호는 사용자가 조건을 확정한 뒤 core-service가</text>
  <text x="20" y="62" font-size="14">조회·검색을 요청하는 순서입니다.</text>
</svg>
