<svg xmlns="http://www.w3.org/2000/svg" width="820" height="76" viewBox="0 0 820 76" role="img" aria-labelledby="title description">
  <title id="title">결과 확인·사람 검토</title>
  <desc id="description">보고서와 추적을 확인하고, 검토·품질 판정을 거쳐 관리자가 비교 기준을 지정합니다. Langfuse의 실제 모델 호출 추적은 실행 중에도 수집합니다.</desc>
  <style>
    text { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .accent { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .accent { fill: #4493f8; }
    }
  </style>
  <rect class="accent" x="0" y="4" width="4" height="64" rx="2" />
  <text x="20" y="20" font-size="15" font-weight="600">결과 확인·사람 검토</text>
  <text x="20" y="42" font-size="13">보고서와 추적을 확인하고, 검토·품질 판정을 거쳐 관리자가 비교 기준을 지정합니다.</text>
  <text x="20" y="62" font-size="13">Langfuse의 실제 모델 호출 추적은 실행 중에도 수집합니다.</text>
</svg>
