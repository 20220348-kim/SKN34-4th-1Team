<svg xmlns="http://www.w3.org/2000/svg" width="820" height="76" viewBox="0 0 820 76" role="img" aria-labelledby="title description">
  <title id="title">질문 분류·처리 경로 선택</title>
  <desc id="description">현재 화면과 대화 문맥을 함께 전달하고, Agents SDK로 질문 의도를 분류합니다. 도구 에이전트 분기는 해당 기능을 켠 회원 요청에 적용됩니다.</desc>
  <style>
    text { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .accent { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .accent { fill: #4493f8; }
    }
  </style>
  <rect class="accent" x="0" y="4" width="4" height="64" rx="2" />
  <text x="20" y="20" font-size="15" font-weight="600">질문 분류·처리 경로 선택</text>
  <text x="20" y="42" font-size="13">현재 화면과 대화 문맥을 함께 전달하고, Agents SDK로 질문 의도를 분류합니다.</text>
  <text x="20" y="62" font-size="13">도구 에이전트 분기는 해당 기능을 켠 회원 요청에 적용됩니다.</text>
</svg>
