<svg xmlns="http://www.w3.org/2000/svg" width="820" height="100" viewBox="0 0 820 100" role="img" aria-labelledby="title description">
  <title id="title">원문 준비·근거 검색</title>
  <desc id="description">저장한 원문이 없거나 갱신이 필요하면 공식 HTML을 읽어 MySQL에 저장하고 청크로 나눕니다.</desc>
  <style>
    text { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .accent { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .accent { fill: #4493f8; }
    }
  </style>
  <rect class="accent" x="0" y="4" width="4" height="88" rx="2" />
  <text x="20" y="25" font-size="20" font-weight="600">원문 준비·근거 검색</text>
  <text x="20" y="56" font-size="18">저장한 원문이 없거나 갱신이 필요하면 공식 HTML을 읽어</text>
  <text x="20" y="82" font-size="18">MySQL에 저장하고 청크로 나눕니다.</text>
</svg>
