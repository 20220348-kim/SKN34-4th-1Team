<svg xmlns="http://www.w3.org/2000/svg" width="820" height="76" viewBox="0 0 820 76" role="img" aria-labelledby="title description">
  <title id="title">문서 생성·검증·다운로드</title>
  <desc id="description">저장된 답변과 원본 양식을 확인한 뒤, AI의 기입 계획에 따라 형식별 편집 도구가 답변을 넣습니다.</desc>
  <style>
    text { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .accent { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .accent { fill: #4493f8; }
    }
  </style>
  <rect class="accent" x="0" y="4" width="4" height="64" rx="2" />
  <text x="20" y="20" font-size="15" font-weight="600">문서 생성·검증·다운로드</text>
  <text x="20" y="42" font-size="13">저장된 답변과 원본 양식을 확인한 뒤, AI의 기입 계획에 따라</text>
  <text x="20" y="62" font-size="13">형식별 편집 도구가 답변을 넣습니다.</text>
</svg>
