<svg xmlns="http://www.w3.org/2000/svg" width="820" height="76" viewBox="0 0 820 76" role="img" aria-labelledby="title description">
  <title id="title">③ 둘 다 성공하면 MySQL에 저장</title>
  <desc id="description">Catalog MySQL에 새 공고를 추가하고 기존 공고의 내용을 갱신합니다. Core가 최신 목록을 가져와 Core MySQL에 저장합니다.</desc>
  <style>
    text { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .accent { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .accent { fill: #4493f8; }
    }
  </style>
  <rect class="accent" x="0" y="4" width="4" height="64" rx="2" />
  <text x="20" y="20" font-size="15" font-weight="600">③ 둘 다 성공하면 MySQL에 저장</text>
  <text x="20" y="42" font-size="13">Catalog MySQL에 새 공고를 추가하고 기존 공고의 내용을 갱신합니다.</text>
  <text x="20" y="62" font-size="13">Core가 최신 목록을 가져와 Core MySQL에 저장합니다.</text>
</svg>
