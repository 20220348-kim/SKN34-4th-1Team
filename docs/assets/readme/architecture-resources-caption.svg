<svg xmlns="http://www.w3.org/2000/svg" width="820" height="96" viewBox="0 0 820 96" role="img" aria-labelledby="title description">
  <title id="title">5.2.5 Kubernetes 내부 리소스 구조</title>
  <desc id="description">아래 그림은 ① 어떤 프로그램을 어디에 묶었는지 → ② 프로그램을 실행하고 연결하는 방법 → ③ 이를 뒷받침하는 기반 구성 순서로 읽으면 됩니다. Kubernetes 공식 아이콘을 사용했으며, 구체적인 이름·포트·설정은 그림 아래의 펼침 표에 정리했습니다.</desc>
  <style>
    text { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .accent { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .accent { fill: #4493f8; }
    }
  </style>
  <rect class="accent" x="0" y="4" width="4" height="84" rx="2" />
  <text x="20" y="20" font-size="15" font-weight="600">5.2.5 Kubernetes 내부 리소스 구조</text>
  <text x="20" y="42" font-size="13">아래 그림은 <tspan font-weight="600">① 어떤 프로그램을 어디에 묶었는지 → ② 프로그램을 실행하고 연결하는 방법 →</tspan></text>
  <text x="20" y="62" font-size="13"><tspan font-weight="600">③ 이를 뒷받침하는 기반 구성</tspan> 순서로 읽으면 됩니다. Kubernetes 공식 아이콘을 사용했으며,</text>
  <text x="20" y="82" font-size="13">구체적인 이름·포트·설정은 그림 아래의 펼침 표에 정리했습니다.</text>
</svg>
