<svg xmlns="http://www.w3.org/2000/svg" width="820" height="76" viewBox="0 0 820 76" role="img" aria-labelledby="title description">
  <title id="title">5.2.3 운영 전체 구성도</title>
  <desc id="description">웹은 Vercel, 백엔드·LLMOps는 AWS EKS에 배치합니다. 아래는 main의 CI 통과 후 자동 배포가 적용되는 구조입니다.</desc>
  <style>
    text { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .accent { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .accent { fill: #4493f8; }
    }
  </style>
  <rect class="accent" x="0" y="4" width="4" height="64" rx="2" />
  <text x="20" y="20" font-size="15" font-weight="600">5.2.3 운영 전체 구성도</text>
  <text x="20" y="42" font-size="13">웹은 Vercel, 백엔드·LLMOps는 AWS EKS에 배치합니다.</text>
  <text x="20" y="62" font-size="13">아래는 <tspan font-weight="600">main의 CI 통과 후 자동 배포가 적용되는 구조</tspan>입니다.</text>
</svg>
